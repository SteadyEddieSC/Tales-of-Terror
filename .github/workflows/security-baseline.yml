name: Security baseline

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'release/**'
      - 'rc/**'
  schedule:
    - cron: '23 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-dependencies-workflows:
    name: Secrets, dependencies, and workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout complete history without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare security reports
        run: mkdir -p artifacts/security

      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' \
            | (cd "$RUNNER_TEMP" && sha256sum --check -)
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version | tee artifacts/security/gitleaks-version.txt
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan repository content and history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --log-opts='--all' --redact --no-banner \
            --report-format sarif --report-path artifacts/security/gitleaks.sarif

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Enforce deterministic workflow policy
        shell: bash
        run: |
          set -euo pipefail
          python quality/validate_repository.py workflows --report-dir artifacts/security/workflow-policy \
            2>&1 | tee artifacts/security/workflow-policy-console.txt

      - name: Install checksum-pinned Zizmor 1.26.1
        shell: bash
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/zizmor-1.26.1-py3-none-manylinux_2_28_x86_64.whl"
          curl -fsSL -o "$wheel" \
            https://files.pythonhosted.org/packages/a8/2b/61ab13d45d6ce57ef5a08bb3246981f62e30bb4938098b17bb7b88110b79/zizmor-1.26.1-py3-none-manylinux_2_28_x86_64.whl
          echo '6a958d8a0941d7e1d0de8436670b5cb7fc64c8028b4d16e3f519ccc77f953cef  zizmor-1.26.1-py3-none-manylinux_2_28_x86_64.whl' \
            | (cd "$RUNNER_TEMP" && sha256sum --check -)
          python -m pip install --disable-pip-version-check --no-deps "$wheel"
          zizmor --version | tee artifacts/security/zizmor-version.txt

      - name: Run Zizmor full workflow audit
        id: zizmor
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          zizmor --offline --format json .github/workflows \
            2>&1 | tee artifacts/security/zizmor.json

      - name: Record Zizmor disposition
        if: always()
        shell: bash
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          printf '{"schema_version":1,"tool":"zizmor","version":"1.26.1","outcome":"%s","blocking_policy":"all Zizmor findings are blocking; the final gate preserves evidence before failing"}\n' \
            "$ZIZMOR_OUTCOME" > artifacts/security/zizmor-disposition.json

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Audit locked npm dependency graph
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --omit=optional --json | tee artifacts/security/npm-audit.json
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Audit locked Python tooling dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
          pip-audit --requirement requirements-dev.txt --format json --output artifacts/security/pip-audit.json

      - name: Snapshot workflow sources for audit evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/security/workflow-sources
          cp -a .github/workflows/. artifacts/security/workflow-sources/
          git rev-parse 'HEAD^{tree}' > artifacts/security/source-tree-sha.txt
          git ls-tree -r HEAD > artifacts/security/source-tree-manifest.txt

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terror-turn-security-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/security
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Zizmor findings
        if: always()
        shell: bash
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          test "$ZIZMOR_OUTCOME" = success

# BEGIN ONE-TIME WORKFLOW REMEDIATION
  remediate-inherited-workflows:
    name: Apply isolated workflow hardening
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/automated-quality-security-baseline' &&
      github.repository == 'SteadyEddieSC/Tales-of-Terror'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact development branch without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/automated-quality-security-baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Apply reviewed checkout and cache hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_root = Path('.github/workflows')
          for path in sorted(workflow_root.glob('*.y*ml')):
              if path.name == 'security-remediation.yml':
                  continue
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              index = 0
              while index < len(lines):
                  line = lines[index]
                  if 'uses: actions/checkout@' not in line:
                      index += 1
                      continue
                  leading = len(line) - len(line.lstrip(' '))
                  step_indent = leading if line.lstrip().startswith('- uses:') else leading - 2
                  property_indent = step_indent + 2
                  end = index + 1
                  while end < len(lines):
                      stripped = lines[end].lstrip(' ')
                      current_indent = len(lines[end]) - len(stripped)
                      if current_indent == step_indent and stripped.startswith('- '):
                          break
                      if current_indent < step_indent:
                          break
                      end += 1
                  block = ''.join(lines[index:end])
                  if 'persist-credentials:' in block:
                      index = end
                      continue
                  with_index = None
                  for candidate in range(index + 1, end):
                      if (
                          lines[candidate].strip() == 'with:'
                          and len(lines[candidate]) - len(lines[candidate].lstrip(' '))
                          == property_indent
                      ):
                          with_index = candidate
                          break
                  newline = '\r\n' if line.endswith('\r\n') else '\n'
                  if with_index is not None:
                      lines.insert(
                          with_index + 1,
                          ' ' * (property_indent + 2)
                          + 'persist-credentials: false'
                          + newline,
                      )
                      index = end + 1
                  else:
                      lines[index + 1:index + 1] = [
                          ' ' * property_indent + 'with:' + newline,
                          ' ' * (property_indent + 2)
                          + 'persist-credentials: false'
                          + newline,
                      ]
                      index = end + 2
              text = ''.join(lines)
              if path.name in {'quality-baseline.yml', 'security-baseline.yml'}:
                  text = ''.join(
                      candidate
                      for candidate in text.splitlines(keepends=True)
                      if candidate.strip()
                      not in {
                          'cache: pip',
                          'cache: npm',
                          'cache-dependency-path: requirements-dev.txt',
                      }
                  )
              path.write_text(text, encoding='utf-8')

          security_path = workflow_root / 'security-baseline.yml'
          security_text = security_path.read_text(encoding='utf-8')
          begin = security_text.index('# BEGIN ONE-TIME WORKFLOW REMEDIATION')
          end_marker = '# END ONE-TIME WORKFLOW REMEDIATION'
          end = security_text.index(end_marker, begin) + len(end_marker)
          while end < len(security_text) and security_text[end] in '\r\n':
              end += 1
          security_path.write_text(
              security_text[:begin].rstrip() + '\n',
              encoding='utf-8',
          )
          temporary = workflow_root / 'security-remediation.yml'
          if temporary.exists():
              temporary.unlink()
          PY

      - name: Verify the final workflow set before commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          failures = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              lines = path.read_text(encoding='utf-8').splitlines()
              for index, line in enumerate(lines):
                  if 'uses: actions/checkout@' not in line:
                      continue
                  leading = len(line) - len(line.lstrip(' '))
                  step_indent = leading if line.lstrip().startswith('- uses:') else leading - 2
                  end = index + 1
                  while end < len(lines):
                      stripped = lines[end].lstrip(' ')
                      current_indent = len(lines[end]) - len(stripped)
                      if current_indent == step_indent and stripped.startswith('- '):
                          break
                      if current_indent < step_indent:
                          break
                      end += 1
                  if not any(
                      candidate.strip() == 'persist-credentials: false'
                      for candidate in lines[index:end]
                  ):
                      failures.append(f'{path}:{index + 1}: missing persist-credentials=false')
          for name in ('quality-baseline.yml', 'security-baseline.yml'):
              text = Path('.github/workflows', name).read_text(encoding='utf-8')
              if any(
                  candidate.strip()
                  in {
                      'cache: pip',
                      'cache: npm',
                      'cache-dependency-path: requirements-dev.txt',
                  }
                  for candidate in text.splitlines()
              ):
                  failures.append(f'{name}: dependency cache remains')
          if Path('.github/workflows/security-remediation.yml').exists():
              failures.append('temporary remediation workflow remains')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
          git diff --check

      - name: Commit and push one atomic hardening change
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Terror Turn Development Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'Harden inherited GitHub Actions workflows'
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" \
            push origin "HEAD:agent/automated-quality-security-baseline"
# END ONE-TIME WORKFLOW REMEDIATION
