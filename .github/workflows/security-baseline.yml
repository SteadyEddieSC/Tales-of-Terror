name: Security baseline

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'release/**'
      - 'rc/**'
  schedule:
    - cron: '23 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-dependencies-workflows:
    name: Secrets, dependencies, and workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout complete history without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare security reports
        run: mkdir -p artifacts/security

      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' \
            | (cd "$RUNNER_TEMP" && sha256sum --check -)
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version | tee artifacts/security/gitleaks-version.txt
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan repository content and history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --log-opts='--all' --redact --no-banner \
            --report-format sarif --report-path artifacts/security/gitleaks.sarif

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Enforce deterministic workflow policy
        shell: bash
        run: |
          set -euo pipefail
          python quality/validate_repository.py workflows --report-dir artifacts/security/workflow-policy \
            2>&1 | tee artifacts/security/workflow-policy-console.txt

      - name: Install checksum-pinned Zizmor 1.26.1
        shell: bash
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/zizmor-1.26.1-py3-none-manylinux_2_28_x86_64.whl"
          curl -fsSL -o "$wheel" \
            https://files.pythonhosted.org/packages/a8/2b/61ab13d45d6ce57ef5a08bb3246981f62e30bb4938098b17bb7b88110b79/zizmor-1.26.1-py3-none-manylinux_2_28_x86_64.whl
          echo '6a958d8a0941d7e1d0de8436670b5cb7fc64c8028b4d16e3f519ccc77f953cef  zizmor-1.26.1-py3-none-manylinux_2_28_x86_64.whl' \
            | (cd "$RUNNER_TEMP" && sha256sum --check -)
          python -m pip install --disable-pip-version-check --no-deps "$wheel"
          zizmor --version | tee artifacts/security/zizmor-version.txt

      - name: Run Zizmor full workflow audit
        id: zizmor
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          zizmor --offline --format json .github/workflows \
            2>&1 | tee artifacts/security/zizmor.json

      - name: Record Zizmor disposition
        if: always()
        shell: bash
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          printf '{"schema_version":1,"tool":"zizmor","version":"1.26.1","outcome":"%s","blocking_policy":"all Zizmor findings are blocking; the final gate preserves evidence before failing"}\n' \
            "$ZIZMOR_OUTCOME" > artifacts/security/zizmor-disposition.json

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Audit locked npm dependency graph
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --omit=optional --json | tee artifacts/security/npm-audit.json
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Audit locked Python tooling dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
          pip-audit --requirement requirements-dev.txt --format json --output artifacts/security/pip-audit.json

      - name: Snapshot workflow sources for audit evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/security/workflow-sources
          cp -a .github/workflows/. artifacts/security/workflow-sources/
          git rev-parse 'HEAD^{tree}' > artifacts/security/source-tree-sha.txt
          git ls-tree -r HEAD > artifacts/security/source-tree-manifest.txt

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terror-turn-security-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/security
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Zizmor findings
        if: always()
        shell: bash
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          test "$ZIZMOR_OUTCOME" = success

# BEGIN ONE-TIME FINAL WORKFLOW MAINTENANCE
  build-detached-maintenance-commit:
    name: Build detached final workflow maintenance commit
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/automated-quality-security-baseline' &&
      github.repository == 'SteadyEddieSC/Tales-of-Terror'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact development branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/automated-quality-security-baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Apply and verify workflow-only maintenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          historical = [
              'preproduction-prototype-authorization.yml',
              'drowned-harbor-visual-baseline.yml',
              'drowned-harbor-presentation-study.yml',
              'drowned-harbor-presentation-family.yml',
              'drowned-harbor-owner-attestation.yml',
              'drowned-harbor-rights-provenance.yml',
              'v020-alpha1-production-tale-scaffold.yml',
              'v020-alpha3-systems-replayability.yml',
              'drowned-harbor-ux-advisory.yml',
          ]
          for name in historical:
              path = root / name
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              marker = f"- '.github/workflows/{name}'"
              before_permissions = True
              output = []
              removed = 0
              for line in lines:
                  if line.startswith('permissions:'):
                      before_permissions = False
                  if before_permissions and line.strip() == marker:
                      removed += 1
                      continue
                  output.append(line)
              if removed == 0:
                  raise SystemExit(f'No historical self-trigger found in {name}')
              path.write_text(''.join(output), encoding='utf-8')

          node_step = '''      - name: Install checksum-pinned Node 24.18.0
                shell: bash
                run: |
                  set -euo pipefail
                  node_root="$RUNNER_TEMP/node-v24.18.0"
                  mkdir -p "$node_root"
                  curl -fsSL -o "$RUNNER_TEMP/node-v24.18.0-linux-x64.tar.xz" \\
                    https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz
                  echo '55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742  node-v24.18.0-linux-x64.tar.xz' \\
                    | (cd "$RUNNER_TEMP" && sha256sum --check -)
                  tar -xJf "$RUNNER_TEMP/node-v24.18.0-linux-x64.tar.xz" \\
                    --strip-components=1 -C "$node_root"
                  echo "$node_root/bin" >> "$GITHUB_PATH"
                  export PATH="$node_root/bin:$PATH"
                  node --version
                  npm --version
          '''
          node_step = ''.join(line[8:] if line.startswith('        ') else line for line in node_step.splitlines(keepends=True))

          def replace_step(path: Path, label: str) -> None:
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              start = next(index for index, line in enumerate(lines) if line.strip() == f'- name: {label}')
              indent = len(lines[start]) - len(lines[start].lstrip(' '))
              end = start + 1
              while end < len(lines):
                  stripped = lines[end].lstrip(' ')
                  current = len(lines[end]) - len(stripped)
                  if current == indent and stripped.startswith('- name:'):
                      break
                  end += 1
              replacement = node_step.splitlines(keepends=True)
              lines[start:end] = replacement
              path.write_text(''.join(lines), encoding='utf-8')

          replace_step(root / 'quality-baseline.yml', 'Set up locked Node runtime')
          replace_step(root / 'security-baseline.yml', 'Set up Node')

          security = root / 'security-baseline.yml'
          text = security.read_text(encoding='utf-8')
          begin_marker = '# BEGIN ONE-TIME FINAL WORKFLOW MAINTENANCE'
          end_marker = '# END ONE-TIME FINAL WORKFLOW MAINTENANCE'
          begin = text.index(begin_marker)
          end = text.index(end_marker, begin) + len(end_marker)
          while end < len(text) and text[end] in '\r\n':
              end += 1
          security.write_text(text[:begin].rstrip() + '\n', encoding='utf-8')
          PY

          ruby -e "require 'yaml'; Dir['.github/workflows/*.yml'].each{|path| YAML.load_file(path)}; puts 'Workflow YAML parsed'"
          python quality/validate_repository.py workflows --report-dir /tmp/workflow-policy
          wheel="$RUNNER_TEMP/zizmor-1.26.1-py3-none-manylinux_2_28_x86_64.whl"
          curl -fsSL -o "$wheel" \
            https://files.pythonhosted.org/packages/a8/2b/61ab13d45d6ce57ef5a08bb3246981f62e30bb4938098b17bb7b88110b79/zizmor-1.26.1-py3-none-manylinux_2_28_x86_64.whl
          echo '6a958d8a0941d7e1d0de8436670b5cb7fc64c8028b4d16e3f519ccc77f953cef  zizmor-1.26.1-py3-none-manylinux_2_28_x86_64.whl' \
            | (cd "$RUNNER_TEMP" && sha256sum --check -)
          python -m pip install --disable-pip-version-check --no-deps "$wheel"
          zizmor --offline .github/workflows
          git diff --check

      - name: Create detached commit metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Terror Turn Development Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'Finalize workflow security and historical gate maintenance'
          mkdir -p artifacts/final-workflow-maintenance
          git rev-parse HEAD > artifacts/final-workflow-maintenance/commit-sha.txt
          git rev-parse 'HEAD^{tree}' > artifacts/final-workflow-maintenance/tree-sha.txt
          git show --stat --oneline --summary HEAD > artifacts/final-workflow-maintenance/commit-summary.txt

      - name: Upload detached commit identifiers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-workflow-maintenance-${{ github.sha }}
          path: artifacts/final-workflow-maintenance
          if-no-files-found: error
          retention-days: 2
# END ONE-TIME FINAL WORKFLOW MAINTENANCE
