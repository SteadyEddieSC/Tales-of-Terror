name: TEMP SEC-MAINT exact lock materialization

on:
  push:
    branches:
      - security/sec-maint-002-plus-baseline-tests

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
      - name: Restore exact proven lock from accepted diagnostic artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sec-maint-002
          mkdir -p /tmp/sec-maint-002
          gh run download 40828169470 --repo "$GITHUB_REPOSITORY" --name sec-maint-002-diagnostic --dir /tmp/sec-maint-002
          test -f /tmp/sec-maint-002/package-lock.json
          actual=$(sha256sum /tmp/sec-maint-002/package-lock.json | awk '{print $1}')
          expected=6935f1dead6050d26361f6a81cf552efef1b143f3077a9910f4542e9ab23d717
          echo "restored_lock_sha256=${actual}"
          test "$actual" = "$expected"
          cp /tmp/sec-maint-002/package-lock.json package-lock.json
      - name: Prove zero-vulnerability install and combined test slice
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --json > /tmp/npm-audit.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const audit = JSON.parse(await readFile('/tmp/npm-audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify(counts));
          if ((counts.total ?? 0) !== 0) throw new Error('Expected zero npm vulnerabilities');
          NODE
          npm run typecheck
          npm run test:service
          npm run test:browser
          npm run build:service
          npm run build:browser
          python tools/validate_toolchain.py
      - name: Commit only the verified frozen lock
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum package-lock.json | awk '{print $1}')
          test "$actual" = "6935f1dead6050d26361f6a81cf552efef1b143f3077a9910f4542e9ab23d717"
          if git diff --quiet -- package-lock.json; then
            echo 'Exact frozen lock is already committed; nothing to push.'
            exit 0
          fi
          git config user.name 'Eddie-LowcountryDigitalWorks'
          git config user.email 'eddie@lowcountrydigitalworks.com'
          git add package-lock.json
          git commit -m 'security: commit verified zero-vulnerability npm lock'
          git push origin HEAD:security/sec-maint-002-plus-baseline-tests
