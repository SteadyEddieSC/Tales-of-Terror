name: v0.2.0-alpha.1 Drowned Harbor production Tale scaffold

on:
  pull_request:
    paths:
      - '.github/workflows/v020-alpha1-production-tale-scaffold.yml'
      - 'CHANGELOG.md'
      - 'docs/releases/v0.2.0-alpha.1-production-tale-scaffold.md'
      - 'docs/playtests/v0.2.0-alpha.1-production-tale-scaffold-evidence.md'
      - 'game/data/scenarios/drowned_harbor_scaffold_v1.json'
      - 'game/data/tales/drowned_harbor/**'
      - 'game/src/tales/drowned_harbor/**'
      - 'game/tests/drowned_harbor_production_scaffold/**'
      - 'game/tests/drowned_harbor_prototype_isolation_test.gd'
      - 'game/export_presets.cfg'
      - 'tools/validate_drowned_harbor_production_scaffold.py'
      - 'tools/test_validate_drowned_harbor_production_scaffold.py'
      - 'tools/validate_drowned_harbor_prototype_isolation.py'
      - 'tools/validate_drowned_harbor_bellhouse_recovery.py'
      - 'tools/portable_bundle.py'
      - 'game/data/tales/tale_catalog_v1.json'
      - 'game/src/session/tale_provider_registry.gd'
      - 'game/src/session/tale_catalog.gd'
      - 'game/src/session/tale_selection_state.gd'
      - 'game/src/session/vertical_slice_coordinator.gd'
      - 'game/src/main/main.gd'
      - 'game/project.godot'
  push:
    branches: [main, feature/v0.2.0-alpha.1-drowned-harbor-scaffold]
    paths:
      - '.github/workflows/v020-alpha1-production-tale-scaffold.yml'
      - 'CHANGELOG.md'
      - 'docs/releases/v0.2.0-alpha.1-production-tale-scaffold.md'
      - 'docs/playtests/v0.2.0-alpha.1-production-tale-scaffold-evidence.md'
      - 'game/data/scenarios/drowned_harbor_scaffold_v1.json'
      - 'game/data/tales/drowned_harbor/**'
      - 'game/src/tales/drowned_harbor/**'
      - 'game/tests/drowned_harbor_production_scaffold/**'
      - 'game/tests/drowned_harbor_prototype_isolation_test.gd'
      - 'game/export_presets.cfg'
      - 'tools/validate_drowned_harbor_production_scaffold.py'
      - 'tools/test_validate_drowned_harbor_production_scaffold.py'
      - 'tools/validate_drowned_harbor_prototype_isolation.py'
      - 'tools/validate_drowned_harbor_bellhouse_recovery.py'
      - 'tools/portable_bundle.py'
      - 'game/data/tales/tale_catalog_v1.json'
      - 'game/src/session/tale_provider_registry.gd'
      - 'game/src/session/tale_catalog.gd'
      - 'game/src/session/tale_selection_state.gd'
      - 'game/src/session/vertical_slice_coordinator.gd'
      - 'game/src/main/main.gd'
      - 'game/project.godot'

permissions:
  contents: read

jobs:
  scaffold:
    name: Native scaffold and ordinary-export exclusion
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GODOT_TEMPLATE_SHA256: 86409db6200b6f8fd3230989c2d2002851f3dd18acf11d7bdbafddf5a0dd0f72
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Enforce exact alpha.1 protected-base inventory
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'feature/v0.2.0-alpha.1-drowned-harbor-scaffold'
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          python - <<'PY'
          import os
          import subprocess

          expected = {
              '.github/workflows/v020-alpha1-production-tale-scaffold.yml',
              'CHANGELOG.md',
              'docs/playtests/v0.2.0-alpha.1-production-tale-scaffold-evidence.md',
              'docs/releases/v0.2.0-alpha.1-production-tale-scaffold.md',
              'game/data/scenarios/drowned_harbor_scaffold_v1.json',
              'game/data/tales/drowned_harbor/localization_en.json',
              'game/data/tales/drowned_harbor/tale_package_v1.json',
              'game/export_presets.cfg',
              'game/src/tales/drowned_harbor/drowned_harbor_board_definition.gd',
              'game/src/tales/drowned_harbor/drowned_harbor_board_definition.gd.uid',
              'game/src/tales/drowned_harbor/drowned_harbor_developer_admission_gate.gd',
              'game/src/tales/drowned_harbor/drowned_harbor_developer_admission_gate.gd.uid',
              'game/src/tales/drowned_harbor/drowned_harbor_director_content.gd',
              'game/src/tales/drowned_harbor/drowned_harbor_director_content.gd.uid',
              'game/src/tales/drowned_harbor/drowned_harbor_rules_content.gd',
              'game/src/tales/drowned_harbor/drowned_harbor_rules_content.gd.uid',
              'game/src/tales/drowned_harbor/drowned_harbor_scaffold_session.gd',
              'game/src/tales/drowned_harbor/drowned_harbor_scaffold_session.gd.uid',
              'game/src/tales/drowned_harbor/drowned_harbor_scoped_provider.gd',
              'game/src/tales/drowned_harbor/drowned_harbor_scoped_provider.gd.uid',
              'game/src/tales/drowned_harbor/drowned_harbor_social_content.gd',
              'game/src/tales/drowned_harbor/drowned_harbor_social_content.gd.uid',
              'game/tests/drowned_harbor_production_scaffold/drowned_harbor_production_scaffold_test.gd',
              'game/tests/drowned_harbor_production_scaffold/drowned_harbor_production_scaffold_test.gd.uid',
              'game/tests/drowned_harbor_prototype_isolation_test.gd',
              'tools/test_validate_drowned_harbor_production_scaffold.py',
              'tools/validate_drowned_harbor_bellhouse_recovery.py',
              'tools/validate_drowned_harbor_production_scaffold.py',
              'tools/validate_drowned_harbor_prototype_isolation.py',
              'tools/portable_bundle.py',
          }
          output = subprocess.check_output(
              ['git', 'diff', '--name-only', f"origin/{os.environ['BASE_REF']}...HEAD"],
              text=True,
          )
          actual = {line for line in output.splitlines() if line}
          if actual != expected:
              raise SystemExit(
                  'alpha.1 path boundary mismatch; '
                  f'missing={sorted(expected - actual)}; '
                  f'unexpected={sorted(actual - expected)}'
              )
          print('Validated exact 30-path alpha.1 protected-base inventory')
          PY

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-dev.txt
          python -m pip check

      - name: Run scaffold and inherited offline validators
        shell: bash
        run: |
          set -euo pipefail
          log_root="$RUNNER_TEMP/alpha1-python"
          rm -rf "$log_root"
          mkdir -p "$log_root"
          trap 'mkdir -p artifacts/alpha1/python; cp -a "$log_root/." artifacts/alpha1/python/' EXIT
          run_check() {
            name="$1"
            shift
            set +e
            "$@" 2>&1 | tee "$log_root/${name}.txt"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$log_root/${name}.status"
            test "$status" -eq 0
          }
          effective_source_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [[ "$effective_source_branch" == "feature/v0.2.0-alpha.1-drowned-harbor-scaffold" ]]; then
            run_check scaffold-validator python tools/validate_drowned_harbor_production_scaffold.py
          else
            scaffold_validator_path=tools/validate_drowned_harbor_production_scaffold.py
            run_check scaffold-validator python "$scaffold_validator_path" --skip-git-boundary
          fi
          run_check scaffold-mutations python tools/test_validate_drowned_harbor_production_scaffold.py
          run_check tale-package python tools/test_tale_package.py
          run_check tale-catalog python tools/test_tale_catalog.py
          run_check p021-validator python tools/validate_p021_production_architecture.py --skip-git-boundary
          run_check p021-mutations python tools/test_validate_p021_production_architecture.py
          run_check post-prototype-validator python tools/validate_post_prototype_reconciliation.py --skip-git-boundary
          run_check post-prototype-mutations python tools/test_validate_post_prototype_reconciliation.py
          run_check drowned-harbor-isolation python tools/validate_drowned_harbor_prototype_isolation_p016.py
          run_check drowned-harbor-isolation-mutations python tools/test_validate_drowned_harbor_prototype_isolation_p016.py
          run_check bellhouse-validator python tools/validate_drowned_harbor_bellhouse_recovery.py
          run_check bellhouse-mutations python tools/test_validate_drowned_harbor_bellhouse_recovery.py
          run_check drowned-harbor-automation python tools/validate_drowned_harbor_prototype_automation.py
          run_check drowned-harbor-automation-mutations python tools/test_validate_drowned_harbor_prototype_automation.py

      - name: Check first-party GDScript formatting and lint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/alpha1/gdscript
          mapfile -t scripts < <(find game -type f -name '*.gd' -not -path 'game/addons/*' | sort)
          gdformat --check "${scripts[@]}" 2>&1 | tee artifacts/alpha1/gdscript/gdformat.txt
          echo "${PIPESTATUS[0]}" > artifacts/alpha1/gdscript/gdformat.status
          gdlint "${scripts[@]}" 2>&1 | tee artifacts/alpha1/gdscript/gdlint.txt
          echo "${PIPESTATUS[0]}" > artifacts/alpha1/gdscript/gdlint.status

      - name: Download checksum-pinned Godot 4.7.1 stable and templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable
          tool_root="$RUNNER_TEMP/godot-4.7.1-alpha1"
          mkdir -p "$tool_root"
          curl -fsSL -o "$tool_root/godot.zip" "$base/Godot_v4.7.1-stable_linux.x86_64.zip"
          echo '4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9  godot.zip' | (cd "$tool_root" && sha512sum --check -)
          curl -fsSL -o "$tool_root/export-templates.tpz" "$base/Godot_v4.7.1-stable_export_templates.tpz"
          echo "$GODOT_TEMPLATE_SHA256  export-templates.tpz" | (cd "$tool_root" && sha256sum --check -)
          unzip -q "$tool_root/godot.zip" -d "$tool_root/godot-bin"
          chmod +x "$tool_root/godot-bin/Godot_v4.7.1-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q "$tool_root/export-templates.tpz" -d "$tool_root/export-template-staging"
          cp -a "$tool_root/export-template-staging/templates/." "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          echo "$tool_root/godot-bin" >> "$GITHUB_PATH"

      - name: Run typed import and focused native regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/alpha1/godot
          godot=Godot_v4.7.1-stable_linux.x86_64
          run_godot() {
            name="$1"
            shift
            set +e
            "$godot" "$@" 2>&1 | tee "artifacts/alpha1/godot/${name}.txt"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "artifacts/alpha1/godot/${name}.status"
            test "$status" -eq 0
          }
          run_godot typed-import --headless --editor --path game --quit
          run_godot scaffold --headless --path game --script res://tests/drowned_harbor_production_scaffold/drowned_harbor_production_scaffold_test.gd
          run_godot tale-package --headless --path game --script res://tests/tale_package_test.gd
          run_godot tale-catalog --headless --path game --script res://tests/tale_catalog_test.gd
          run_godot replay --headless --path game --script res://tests/tale_replay_equivalence_test.gd
          run_godot prototype-isolation --headless --path game --script res://tests/drowned_harbor_prototype_isolation_test.gd
          run_godot main-smoke --headless --path game --quit-after 2

      - name: Export and inspect exact-head Windows and Linux PCK inventories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/alpha1/windows builds/alpha1/linux artifacts/alpha1/export
          Godot_v4.7.1-stable_linux.x86_64 --headless --path game \
            --export-pack "Internal Windows x86_64" "$PWD/builds/alpha1/windows/lantern_house_internal.pck" \
            2>&1 | tee artifacts/alpha1/export/windows-export.log
          Godot_v4.7.1-stable_linux.x86_64 --headless --path game \
            --export-pack "Internal Linux x86_64" "$PWD/builds/alpha1/linux/lantern_house_internal.pck" \
            2>&1 | tee artifacts/alpha1/export/linux-export.log
          python tools/validate_drowned_harbor_production_scaffold.py export-inventory --platform windows \
            --pck builds/alpha1/windows/lantern_house_internal.pck \
            --export-log artifacts/alpha1/export/windows-export.log --source-sha "$SOURCE_SHA" \
            --output artifacts/alpha1/export/windows.json \
            | tee artifacts/alpha1/export/windows.txt
          echo "${PIPESTATUS[0]}" > artifacts/alpha1/export/windows.status
          python tools/validate_drowned_harbor_production_scaffold.py export-inventory --platform linux \
            --pck builds/alpha1/linux/lantern_house_internal.pck \
            --export-log artifacts/alpha1/export/linux-export.log --source-sha "$SOURCE_SHA" \
            --output artifacts/alpha1/export/linux.json \
            | tee artifacts/alpha1/export/linux.txt
          echo "${PIPESTATUS[0]}" > artifacts/alpha1/export/linux.status

      - name: Upload bounded alpha.1 machine evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p020-alpha1-drowned-harbor-scaffold-evidence
          path: artifacts/alpha1
          if-no-files-found: warn
          retention-days: 14

      - name: Remove generated evidence and exports
        if: always()
        run: rm -rf artifacts/alpha1 builds/alpha1 game/.godot

      - name: Prove source tree remains clean
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
