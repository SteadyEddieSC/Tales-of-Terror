name: P0.23 Alpha.3 systems and replayability contract

on:
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/p021-production-architecture.yml'
      - '.github/workflows/p022-alpha2-graybox-contract.yml'
      - '.github/workflows/p023-alpha3-systems-replayability-contract.yml'
      - '.github/workflows/post-prototype-reconciliation.yml'
      - 'docs/preproduction/P0.21_Implementation_Issue_Set.md'
      - 'docs/preproduction/P0.23_Alpha3_Implementation_Issue.md'
      - 'docs/preproduction/README.md'
      - 'docs/preproduction/drowned_harbor_alpha3_systems_replayability_contract_schema_v1.json'
      - 'docs/preproduction/drowned_harbor_alpha3_systems_replayability_contract_v1.json'
      - 'docs/preproduction/post_prototype_status_v1.json'
      - 'docs/releases/P0.23-alpha3-systems-replayability-contract.md'
      - 'docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md'
      - 'docs/technical/Drowned_Harbor_Alpha3_Systems_and_Replayability_Contract_v1.md'
      - 'tools/test_validate_p023_alpha3_systems_replayability_contract.py'
      - 'tools/validate_p023_alpha3_systems_replayability_contract.py'
      - 'tools/test_validate_post_dh_present_status.py'
      - 'tools/validate_post_dh_present_status.py'
      - 'tools/test_validate_post_dh_ux_status.py'
      - 'tools/validate_post_dh_ux_status.py'
      - 'tools/test_validate_post_dh_rights_status.py'
      - 'tools/validate_post_dh_rights_status.py'
      - 'tools/test_validate_post_dh_owner_attest_status.py'
      - 'tools/validate_post_dh_owner_attest_status.py'
      - 'tools/test_validate_post_dh_ux_final_status.py'
      - 'tools/validate_post_dh_ux_final_status.py'
  push:
    branches: [main, docs/p0.23-alpha3-systems-replayability-contract]
    paths:
      - 'README.md'
      - '.github/workflows/p021-production-architecture.yml'
      - '.github/workflows/p022-alpha2-graybox-contract.yml'
      - '.github/workflows/p023-alpha3-systems-replayability-contract.yml'
      - '.github/workflows/post-prototype-reconciliation.yml'
      - 'docs/preproduction/P0.21_Implementation_Issue_Set.md'
      - 'docs/preproduction/P0.23_Alpha3_Implementation_Issue.md'
      - 'docs/preproduction/README.md'
      - 'docs/preproduction/drowned_harbor_alpha3_systems_replayability_contract_schema_v1.json'
      - 'docs/preproduction/drowned_harbor_alpha3_systems_replayability_contract_v1.json'
      - 'docs/preproduction/post_prototype_status_v1.json'
      - 'docs/releases/P0.23-alpha3-systems-replayability-contract.md'
      - 'docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md'
      - 'docs/technical/Drowned_Harbor_Alpha3_Systems_and_Replayability_Contract_v1.md'
      - 'tools/test_validate_p023_alpha3_systems_replayability_contract.py'
      - 'tools/validate_p023_alpha3_systems_replayability_contract.py'
      - 'tools/test_validate_post_dh_present_status.py'
      - 'tools/validate_post_dh_present_status.py'
      - 'tools/test_validate_post_dh_ux_status.py'
      - 'tools/validate_post_dh_ux_status.py'
      - 'tools/test_validate_post_dh_rights_status.py'
      - 'tools/validate_post_dh_rights_status.py'
      - 'tools/test_validate_post_dh_owner_attest_status.py'
      - 'tools/validate_post_dh_owner_attest_status.py'
      - 'tools/test_validate_post_dh_ux_final_status.py'
      - 'tools/validate_post_dh_ux_final_status.py'

permissions:
  contents: read

jobs:
  contract:
    name: Validate closed Alpha.3 authority and current succession
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.9
      - name: Enforce historical or reconciliation path boundary
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          python - <<'PY2'
          import os
          import subprocess

          historical = {
              ".github/workflows/p021-production-architecture.yml",
              ".github/workflows/p022-alpha2-graybox-contract.yml",
              ".github/workflows/p023-alpha3-systems-replayability-contract.yml",
              ".github/workflows/post-prototype-reconciliation.yml",
              "docs/preproduction/P0.21_Implementation_Issue_Set.md",
              "docs/preproduction/P0.23_Alpha3_Implementation_Issue.md",
              "docs/preproduction/README.md",
              "docs/preproduction/drowned_harbor_alpha3_systems_replayability_contract_schema_v1.json",
              "docs/preproduction/drowned_harbor_alpha3_systems_replayability_contract_v1.json",
              "docs/preproduction/post_prototype_status_v1.json",
              "docs/releases/P0.23-alpha3-systems-replayability-contract.md",
              "docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md",
              "docs/technical/Drowned_Harbor_Alpha3_Systems_and_Replayability_Contract_v1.md",
              "tools/test_validate_p023_alpha3_systems_replayability_contract.py",
              "tools/validate_p023_alpha3_systems_replayability_contract.py",
          }
          post_alpha3 = {
              "README.md",
              ".github/workflows/p021-production-architecture.yml",
              ".github/workflows/p022-alpha2-graybox-contract.yml",
              ".github/workflows/p023-alpha3-systems-replayability-contract.yml",
              ".github/workflows/post-prototype-reconciliation.yml",
              "docs/preproduction/README.md",
              "docs/preproduction/post_prototype_status_v1.json",
              "docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md",
              "tools/test_validate_p023_alpha3_systems_replayability_contract.py",
              "tools/validate_p023_alpha3_systems_replayability_contract.py",
          }
          post_dh_present = {
              "README.md",
              ".github/workflows/p021-production-architecture.yml",
              ".github/workflows/p022-alpha2-graybox-contract.yml",
              ".github/workflows/p023-alpha3-systems-replayability-contract.yml",
              ".github/workflows/post-prototype-reconciliation.yml",
              "docs/preproduction/README.md",
              "docs/preproduction/post_prototype_status_v1.json",
              "docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md",
              "tools/test_validate_post_dh_present_status.py",
              "tools/validate_post_dh_present_status.py",
          }
          post_dh_ux = {
              "README.md",
              ".github/workflows/p021-production-architecture.yml",
              ".github/workflows/p022-alpha2-graybox-contract.yml",
              ".github/workflows/p023-alpha3-systems-replayability-contract.yml",
              ".github/workflows/post-prototype-reconciliation.yml",
              "docs/preproduction/README.md",
              "docs/preproduction/post_prototype_status_v1.json",
              "docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md",
              "tools/test_validate_post_dh_ux_status.py",
              "tools/validate_post_dh_ux_status.py",
          }
          post_dh_rights = {
              "README.md",
              ".github/workflows/p021-production-architecture.yml",
              ".github/workflows/p022-alpha2-graybox-contract.yml",
              ".github/workflows/p023-alpha3-systems-replayability-contract.yml",
              ".github/workflows/post-prototype-reconciliation.yml",
              "docs/preproduction/README.md",
              "docs/preproduction/post_prototype_status_v1.json",
              "docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md",
              "tools/test_validate_post_dh_rights_status.py",
              "tools/validate_post_dh_rights_status.py",
          }
          post_dh_owner_attest = {
              "README.md",
              ".github/workflows/p021-production-architecture.yml",
              ".github/workflows/p022-alpha2-graybox-contract.yml",
              ".github/workflows/p023-alpha3-systems-replayability-contract.yml",
              ".github/workflows/post-prototype-reconciliation.yml",
              "docs/preproduction/README.md",
              "docs/preproduction/post_prototype_status_v1.json",
              "docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md",
              "tools/test_validate_post_dh_owner_attest_status.py",
              "tools/validate_post_dh_owner_attest_status.py",
          }
          post_dh_ux_final = {
              "README.md",
              ".github/workflows/p021-production-architecture.yml",
              ".github/workflows/p022-alpha2-graybox-contract.yml",
              ".github/workflows/p023-alpha3-systems-replayability-contract.yml",
              ".github/workflows/post-prototype-reconciliation.yml",
              "docs/preproduction/README.md",
              "docs/preproduction/post_prototype_status_v1.json",
              "docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md",
              "tools/test_validate_post_dh_ux_final_status.py",
              "tools/validate_post_dh_ux_final_status.py",
          }

          head = os.environ["HEAD_REF"]
          expected = None
          if head == "docs/p0.23-alpha3-systems-replayability-contract": expected = historical
          elif head == "docs/post-alpha3-status-reconciliation": expected = post_alpha3
          elif head == "docs/post-dh-present-status-reconciliation": expected = post_dh_present
          elif head == "docs/post-dh-ux-status-reconciliation": expected = post_dh_ux
          elif head == "docs/post-dh-rights-status-reconciliation": expected = post_dh_rights
          elif head == "docs/post-dh-owner-attest-status-reconciliation": expected = post_dh_owner_attest
          elif head == "docs/post-dh-ux-final-status-reconciliation": expected = post_dh_ux_final

          if expected is None:
              print(f"No release-specific exact boundary registered for {head}; current status validation still applies")
              raise SystemExit(0)

          output = subprocess.check_output(["git", "diff", "--name-only", f"origin/{os.environ['BASE_REF']}...HEAD"], text=True)
          actual = {line for line in output.splitlines() if line}
          if actual != expected:
              raise SystemExit(f"path mismatch missing={sorted(expected - actual)} unexpected={sorted(actual - expected)}")
          print(f"Validated exact {len(expected)}-path inventory for {head}")
          PY2
      - name: Validate historical contract or current status
        shell: bash
        run: |
          set -euo pipefail
          effective="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [[ "$effective" == "docs/p0.22-alpha2-graybox-contract" ]]; then
            python tools/validate_p022_alpha2_graybox_contract.py
            python tools/test_validate_p022_alpha2_graybox_contract.py
            python tools/validate_post_prototype_reconciliation.py
            python tools/test_validate_post_prototype_reconciliation.py
            python tools/validate_p021_production_architecture.py
            python tools/test_validate_p021_production_architecture.py
          elif [[ "$effective" == "docs/p0.23-alpha3-systems-replayability-contract" ]]; then
            python tools/validate_p023_alpha3_systems_replayability_contract.py
            python tools/test_validate_p023_alpha3_systems_replayability_contract.py
          elif [[ "$effective" == "docs/post-alpha3-status-reconciliation" ]]; then
            python tools/validate_p023_alpha3_systems_replayability_contract.py --skip-git-boundary --later-succession
            python tools/test_validate_p023_alpha3_systems_replayability_contract.py --later-succession
          elif [[ "$effective" == "docs/post-dh-present-status-reconciliation" ]]; then
            python tools/validate_post_dh_present_status.py
            python tools/test_validate_post_dh_present_status.py
          elif [[ "$effective" == "docs/post-dh-ux-status-reconciliation" ]]; then
            python tools/validate_post_dh_ux_status.py
            python tools/test_validate_post_dh_ux_status.py
          elif [[ "$effective" == "docs/post-dh-rights-status-reconciliation" ]]; then
            python tools/validate_post_dh_rights_status.py
            python tools/test_validate_post_dh_rights_status.py
          elif [[ "$effective" == "docs/post-dh-owner-attest-status-reconciliation" ]]; then
            python tools/validate_post_dh_owner_attest_status.py
            python tools/test_validate_post_dh_owner_attest_status.py
          else
            python tools/validate_post_dh_ux_final_status.py
            python tools/test_validate_post_dh_ux_final_status.py
          fi
      - name: Preserve Alpha.2 runtime and authoring contracts
        run: |
          python tools/validate_drowned_harbor_alpha2_graybox.py --skip-git-boundary
          python tools/test_validate_drowned_harbor_alpha2_graybox.py
          python tools/validate_tale_authoring_reference.py
          python tools/test_validate_tale_authoring_reference.py
          python tools/tale_package.py validate
          python tools/test_tale_package.py
          python tools/tale_catalog.py validate
          python tools/test_tale_catalog.py
      - name: Parse governed JSON, Python, and workflow YAML
        run: |
          python -m py_compile tools/validate_post_dh_ux_final_status.py tools/test_validate_post_dh_ux_final_status.py
          python - <<'PY2'
          import json
          from pathlib import Path
          for path in [
              Path('docs/preproduction/drowned_harbor_alpha3_systems_replayability_contract_v1.json'),
              Path('docs/preproduction/drowned_harbor_alpha3_systems_replayability_contract_schema_v1.json'),
              Path('docs/preproduction/post_prototype_status_v1.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
          print('Governed JSON parsed')
          PY2
          ruby - <<'RUBY'
          require 'yaml'
          %w[.github/workflows/p021-production-architecture.yml .github/workflows/p022-alpha2-graybox-contract.yml .github/workflows/p023-alpha3-systems-replayability-contract.yml .github/workflows/post-prototype-reconciliation.yml].each { |p| YAML.load_file(p) }
          puts 'Governed workflow YAML parsed'
          RUBY
      - name: Prove clean source tree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"