name: Drowned Harbor presentation family registration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/drowned-harbor-presentation-family.yml'
      - 'docs/releases/DH-PRESENT-002-003-presentation-family-registration.md'
      - 'docs/tales/drowned_harbor/visual/Drowned_Harbor_Last_Light_Presentation_Hook_Storyboard_Study_v1.md'
      - 'docs/tales/drowned_harbor/visual/Drowned_Harbor_Ending_Resolution_and_Epilogue_Attribution_Presentation_Hook_Storyboard_Study_v1.md'
      - 'docs/tales/drowned_harbor/visual/Drowned_Harbor_Presentation_Family_Consistency_and_Conversion_Readiness_v1.md'
      - 'docs/tales/drowned_harbor/visual/drowned_harbor_presentation_family_registration_v1.json'
      - 'docs/tales/drowned_harbor/visual/drowned_harbor_presentation_family_registration_schema_v1.json'
      - 'art/licenses/drowned_harbor/visual/dh_present_002_003_provenance_v1.json'
      - 'tools/validate_drowned_harbor_presentation_family.py'
      - 'tools/test_validate_drowned_harbor_presentation_family.py'

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact DH-PRESENT-REG-002 family package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - name: Validate contract and exact Git boundary
        run: python tools/validate_drowned_harbor_presentation_family.py
      - name: Run fail-closed mutation suite
        run: python tools/test_validate_drowned_harbor_presentation_family.py
      - name: Compile validators
        run: python -m py_compile tools/validate_drowned_harbor_presentation_family.py tools/test_validate_drowned_harbor_presentation_family.py
      - name: Prove governed JSON parses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('docs/tales/drowned_harbor/visual/drowned_harbor_presentation_family_registration_v1.json'),
              Path('docs/tales/drowned_harbor/visual/drowned_harbor_presentation_family_registration_schema_v1.json'),
              Path('art/licenses/drowned_harbor/visual/dh_present_002_003_provenance_v1.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
          print('Governed JSON parsed')
          PY
