name: Preproduction interaction-state trace validation

on:
  pull_request:
    paths:
      - '.github/workflows/preproduction-interaction-state-traces.yml'
      - 'docs/preproduction/interaction_state_trace_schema_v1.json'
      - 'docs/preproduction/P0.11_Release_Summary.md'
      - 'docs/technical/Drowned_Harbor_Interaction_State_Traceability_Contract_v1.md'
      - 'docs/tales/drowned_harbor/interaction/**'
      - 'docs/tales/drowned_harbor/ui/**'
      - 'docs/preproduction/drowned_harbor_cross_media_traceability_v1.json'
      - 'tools/validate_interaction_state_traces.py'
      - 'tools/test_validate_interaction_state_traces.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/preproduction-interaction-state-traces.yml'
      - 'docs/preproduction/interaction_state_trace_schema_v1.json'
      - 'docs/preproduction/P0.11_Release_Summary.md'
      - 'docs/technical/Drowned_Harbor_Interaction_State_Traceability_Contract_v1.md'
      - 'docs/tales/drowned_harbor/interaction/**'
      - 'docs/tales/drowned_harbor/ui/**'
      - 'docs/preproduction/drowned_harbor_cross_media_traceability_v1.json'
      - 'tools/validate_interaction_state_traces.py'
      - 'tools/test_validate_interaction_state_traces.py'

permissions:
  contents: read

jobs:
  validate:
    name: Interaction state, privacy, and recovery contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate interaction-state traces
        run: python tools/validate_interaction_state_traces.py
      - name: Run interaction-state trace regression tests
        run: python tools/test_validate_interaction_state_traces.py
