name: P0.11 one-time resolution layout corrections

on:
  push:
    branches: [docs/p0.11-interaction-state-traceability]
    paths:
      - '.github/workflows/p0.11-one-time-resolution-layout-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: docs/p0.11-interaction-state-traceability
      - name: Align resolution traces to P0.10 storyboards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/tales/drowned_harbor/interaction/drowned_harbor_interaction_resolution_traces_v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          entries = {entry['trace_id']: entry for entry in data['entries']}

          trace = entries['DH-IS-008']['presentation_obligations']
          assert trace['required_layout_regions'] == [
              'stage_objective_upper_left',
              'tide_state_upper_center',
              'playable_board_center',
              'public_recap_panel',
              'caption_lower_center',
              'seat_rail_bottom',
              'controller_prompt_strip',
          ]
          assert trace['confirmation_pattern'] == 'no_commit'
          trace['required_layout_regions'] = [
              'stage_objective_upper_left',
              'tide_state_upper_center',
              'playable_board_center',
              'caption_lower_center',
              'seat_rail_bottom',
              'controller_prompt_strip',
          ]
          trace['confirmation_pattern'] = 'acknowledgement_only'

          trace = entries['DH-IS-010']['presentation_obligations']
          assert trace['required_layout_regions'] == [
              'stage_objective_upper_left',
              'playable_board_center',
              'public_recap_panel',
              'caption_lower_center',
              'seat_rail_bottom',
              'controller_prompt_strip',
          ]
          trace['required_layout_regions'] = [
              'stage_objective_upper_left',
              'playable_board_center',
              'decision_panel_center',
              'caption_lower_center',
              'seat_rail_bottom',
              'controller_prompt_strip',
          ]

          trace = entries['DH-IS-011']['presentation_obligations']
          assert trace['required_layout_regions'] == [
              'stage_objective_upper_left',
              'host_authority_upper_right',
              'decision_panel_center',
              'caption_lower_center',
              'seat_rail_bottom',
              'controller_prompt_strip',
          ]
          trace['required_layout_regions'] = [
              'stage_objective_upper_left',
              'tide_state_upper_center',
              'decision_panel_center',
              'caption_lower_center',
              'seat_rail_bottom',
              'controller_prompt_strip',
          ]

          trace = entries['DH-IS-012']['presentation_obligations']
          assert trace['required_layout_regions'] == [
              'outcome_columns',
              'public_recap_panel',
              'caption_lower_center',
              'seat_rail_bottom',
              'controller_prompt_strip',
          ]
          trace['required_layout_regions'] = [
              'stage_objective_upper_left',
              'outcome_columns',
              'caption_lower_center',
              'seat_rail_bottom',
              'controller_prompt_strip',
          ]

          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/tales/drowned_harbor/interaction/drowned_harbor_interaction_resolution_traces_v1.json
          git commit -m "content: align resolution traces with storyboards"
          git push origin HEAD:docs/p0.11-interaction-state-traceability
