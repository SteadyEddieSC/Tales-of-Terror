name: P0.11 one-time contract data fix

on:
  push:
    branches: [docs/p0.11-interaction-state-traceability]
    paths:
      - '.github/workflows/p0.11-one-time-contract-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: docs/p0.11-interaction-state-traceability
      - name: Apply asserted interaction contract corrections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('docs/tales/drowned_harbor/interaction/drowned_harbor_interaction_core_traces_v1.json'),
              Path('docs/tales/drowned_harbor/interaction/drowned_harbor_interaction_continuity_traces_v1.json'),
          ]
          manifests = {path: json.loads(path.read_text(encoding='utf-8')) for path in paths}
          entries = {
              entry['trace_id']: entry
              for data in manifests.values()
              for entry in data['entries']
          }

          for trace_id in ('DH-IS-002', 'DH-IS-013', 'DH-IS-021'):
              events = entries[trace_id]['projection_contract']['emitted_events']
              assert len(events) == 1, (trace_id, events)
              assert events[0]['exactly_once'] is False, trace_id
              events[0]['exactly_once'] = True

          returning = entries['DH-IS-017']['projection_contract']
          assert returning['private_outputs'] == ['New seat-private information when required']
          returning['private_outputs'] = []

          for path, data in manifests.items():
              path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/tales/drowned_harbor/interaction/drowned_harbor_interaction_core_traces_v1.json
          git add docs/tales/drowned_harbor/interaction/drowned_harbor_interaction_continuity_traces_v1.json
          git commit -m "content: align interaction commit and privacy contracts"
          git push origin HEAD:docs/p0.11-interaction-state-traceability
