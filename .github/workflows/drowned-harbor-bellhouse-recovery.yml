name: Drowned Harbor Bellhouse decision and recovery

on:
  pull_request:
    paths:
      - '.github/workflows/drowned-harbor-bellhouse-recovery.yml'

permissions:
  contents: read

jobs:
  diagnose-hardened-contract:
    name: Temporary read-only P0.16 hardened-contract diagnosis
    if: github.head_ref == 'agent/p0.16-drowned-harbor-bellhouse-recovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact baseline and branch
        run: |
          test "$GITHUB_HEAD_REF" = "agent/p0.16-drowned-harbor-bellhouse-recovery"
          test "$(git merge-base HEAD origin/main)" = "1d27a1584fc9f8513e9322875477133b77ef8050"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Build hardened corrected contract
        run: |
          mkdir -p artifacts/p016-hardened-diagnosis
          python - <<'PY'
          from pathlib import Path
          import re

          validator_path = Path('tools/validate_drowned_harbor_bellhouse_recovery.py')
          text = validator_path.read_text(encoding='utf-8')

          replacements = [
              (
                  re.compile(
                      r'    require\(\n'
                      r'\s+len\(set\(private_strings\(private\)\)\) >= 5,\n'
                      r'\s+"Bellhouse fixture must retain private leak sentinels",\n'
                      r'\s+\)'
                  ),
                  (
                      "    require(\n"
                      "        set(private_strings(private))\n"
                      "        == {\n"
                      "            \"PRIVATE_BELLMARKED\",\n"
                      "            \"PRIVATE_PRESERVE_HARBOR\",\n"
                      "            \"PRIVATE_SIXTH_NAME\",\n"
                      "        },\n"
                      "        \"Bellhouse fixture private leak sentinels drifted\",\n"
                      "    )"
                  ),
                  'Bellhouse sentinels',
              ),
              (
                  re.compile(
                      r'    require\(\n'
                      r'\s+len\(set\(private_strings\(private\)\)\) >= 5,\n'
                      r'\s+"recovery fixture must retain private leak sentinels",\n'
                      r'\s+\)'
                  ),
                  (
                      "    require(\n"
                      "        set(private_strings(private))\n"
                      "        == {\n"
                      "            \"PRIVATE_ARCHIVE_ROUTE_RESERVED_FOR_DROWNED_GUIDE\",\n"
                      "            \"PRIVATE_FIND_MISSING_NAME\",\n"
                      "        },\n"
                      "        \"recovery fixture private leak sentinels drifted\",\n"
                      "    )"
                  ),
                  'recovery sentinels',
              ),
          ]
          for pattern, replacement, label in replacements:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label} replacement count: {count}')

          shell_anchor = '''    require(
              'path="res://tests/drowned_harbor_dev_only/'
              'bellhouse_decision_shell.gd"' in scene,
              "scene does not use the bounded Bellhouse shell script",
          )'''
          shell_assertions = '''    require(
              shell.count("_commit_count = 1") == 1,
              "shell must contain exactly one exactly-once commit assignment",
          )
          require(
              shell.count('"production_authority": false') == 1,
              "shell production-authority denial drifted",
          )
          require(
              shell.count('"stable_seat_reset": false') == 1,
              "shell stable-seat preservation marker drifted",
          )

          ''' + shell_anchor
          if text.count(shell_anchor) != 1:
              raise SystemExit('shell assertion anchor drifted')
          text = text.replace(shell_anchor, shell_assertions, 1)

          docs_anchor = '''            require(phrase.lower() in text.lower(), f"{path} missing phrase: {phrase}")'''
          docs_assertions = docs_anchor + '''
              if path == TECHNICAL_PATH:
                  require(
                      "physical-controller evidence" in text.lower(),
                      "technical contract missing exact physical-controller evidence phrase",
                  )
              if path == SUMMARY_PATH:
                  require(
                      text.startswith("# P0.16 —"),
                      "release summary heading must retain the exact P0.16 identity",
                  )'''
          if text.count(docs_anchor) != 1:
              raise SystemExit('documentation assertion anchor drifted')
          text = text.replace(docs_anchor, docs_assertions, 1)
          validator_path.write_text(text, encoding='utf-8')
          Path('artifacts/p016-hardened-diagnosis/validator.corrected.py').write_text(
              text,
              encoding='utf-8',
          )

          technical_path = Path(
              'docs/technical/Drowned_Harbor_Bellhouse_Decision_Recovery_v1.md'
          )
          technical = technical_path.read_text(encoding='utf-8')
          technical_old = (
              'This is not a production reducer, production save, final Ledger '
              'mechanic, or balance commitment.'
          )
          technical_new = (
              'No production authority is created. This is not a production '
              'reducer, production save, final Ledger mechanic, or balance commitment.'
          )
          if technical.count(technical_old) != 1:
              raise SystemExit('technical production-authority source drifted')
          technical_path.write_text(
              technical.replace(technical_old, technical_new, 1),
              encoding='utf-8',
          )

          summary_path = Path('docs/preproduction/P0.16_Release_Summary.md')
          summary = summary_path.read_text(encoding='utf-8')
          summary_old = 'The event is not production gameplay authority.'
          summary_new = (
              'The event is not production gameplay authority. '
              'No production authority is created.'
          )
          if summary.count(summary_old) != 1:
              raise SystemExit('summary production-authority source drifted')
          summary_path.write_text(
              summary.replace(summary_old, summary_new, 1),
              encoding='utf-8',
          )
          PY

      - name: Capture hardened validator and regression outputs
        run: |
          set +e
          python -m py_compile tools/validate_drowned_harbor_bellhouse_recovery.py \
            > artifacts/p016-hardened-diagnosis/py-compile.txt 2>&1
          echo "$?" > artifacts/p016-hardened-diagnosis/py-compile.status
          python tools/validate_drowned_harbor_bellhouse_recovery.py \
            > artifacts/p016-hardened-diagnosis/validator.txt 2>&1
          echo "$?" > artifacts/p016-hardened-diagnosis/validator.status
          python tools/test_validate_drowned_harbor_bellhouse_recovery.py \
            > artifacts/p016-hardened-diagnosis/regressions.txt 2>&1
          echo "$?" > artifacts/p016-hardened-diagnosis/regressions.status
          set -e

      - name: Upload hardened-contract diagnosis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p016-hardened-contract-diagnosis
          path: artifacts/p016-hardened-diagnosis
          if-no-files-found: error
          retention-days: 14

      - name: Restore source and confirm cleanliness
        if: always()
        run: |
          git checkout -- \
            docs/preproduction/P0.16_Release_Summary.md \
            docs/technical/Drowned_Harbor_Bellhouse_Decision_Recovery_v1.md \
            tools/validate_drowned_harbor_bellhouse_recovery.py
          rm -rf artifacts/p016-hardened-diagnosis tools/__pycache__
          git diff --exit-code
          test -z "$(git status --porcelain)"
