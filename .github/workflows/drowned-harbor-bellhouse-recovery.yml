name: Drowned Harbor Bellhouse decision and recovery

on:
  pull_request:
    paths:
      - '.github/workflows/drowned-harbor-bellhouse-recovery.yml'
      - '.github/workflows/drowned-harbor-low-tide-shell.yml'
      - '.github/workflows/drowned-harbor-projection-fixtures.yml'
      - '.github/workflows/drowned-harbor-prototype-isolation.yml'
      - 'docs/preproduction/P0.16_Release_Summary.md'
      - 'docs/technical/Drowned_Harbor_Bellhouse_Decision_Recovery_v1.md'
      - 'game/tests/drowned_harbor_bellhouse_recovery_test.gd'
      - 'game/tests/drowned_harbor_bellhouse_recovery_test.gd.uid'
      - 'game/tests/drowned_harbor_dev_only/README.md'
      - 'game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd'
      - 'game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd.uid'
      - 'game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.tscn'
      - 'game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd'
      - 'game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd.uid'
      - 'game/tests/drowned_harbor_prototype_isolation_test.gd'
      - 'game/tests/drowned_harbor_prototype_manifest_v1.json'
      - 'tools/test_validate_drowned_harbor_bellhouse_recovery.py'
      - 'tools/test_validate_drowned_harbor_low_tide_shell_p016.py'
      - 'tools/test_validate_drowned_harbor_projection_fixtures_p016.py'
      - 'tools/test_validate_drowned_harbor_prototype_isolation_p016.py'
      - 'tools/validate_drowned_harbor_bellhouse_recovery.py'
      - 'tools/validate_drowned_harbor_low_tide_shell_p016.py'
      - 'tools/validate_drowned_harbor_projection_fixtures_p016.py'
      - 'tools/validate_drowned_harbor_prototype_isolation_p016.py'

permissions:
  contents: read

jobs:
  canonicalize:
    name: Temporary canonical GDScript evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Enforce exact P0.16 release boundary
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          python - <<'PY'
          import os
          import subprocess

          expected = {
              '.github/workflows/drowned-harbor-bellhouse-recovery.yml',
              '.github/workflows/drowned-harbor-low-tide-shell.yml',
              '.github/workflows/drowned-harbor-projection-fixtures.yml',
              '.github/workflows/drowned-harbor-prototype-isolation.yml',
              'docs/preproduction/P0.16_Release_Summary.md',
              'docs/technical/Drowned_Harbor_Bellhouse_Decision_Recovery_v1.md',
              'game/tests/drowned_harbor_bellhouse_recovery_test.gd',
              'game/tests/drowned_harbor_bellhouse_recovery_test.gd.uid',
              'game/tests/drowned_harbor_dev_only/README.md',
              'game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd',
              'game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd.uid',
              'game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.tscn',
              'game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd',
              'game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd.uid',
              'game/tests/drowned_harbor_prototype_isolation_test.gd',
              'game/tests/drowned_harbor_prototype_manifest_v1.json',
              'tools/test_validate_drowned_harbor_bellhouse_recovery.py',
              'tools/test_validate_drowned_harbor_low_tide_shell_p016.py',
              'tools/test_validate_drowned_harbor_projection_fixtures_p016.py',
              'tools/test_validate_drowned_harbor_prototype_isolation_p016.py',
              'tools/validate_drowned_harbor_bellhouse_recovery.py',
              'tools/validate_drowned_harbor_low_tide_shell_p016.py',
              'tools/validate_drowned_harbor_projection_fixtures_p016.py',
              'tools/validate_drowned_harbor_prototype_isolation_p016.py',
          }
          output = subprocess.check_output(
              ['git', 'diff', '--name-only', f"origin/{os.environ['BASE_REF']}...HEAD"],
              text=True,
          )
          actual = {line for line in output.splitlines() if line}
          if actual != expected:
              raise SystemExit(
                  f'P0.16 path boundary mismatch; '
                  f'missing={sorted(expected - actual)}; '
                  f'unexpected={sorted(actual - expected)}'
              )
          print('Validated exact 24-path P0.16 release boundary')
          PY

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Install pinned GDScript Toolkit
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-dev.txt
          python -m pip check

      - name: Format canonical copies
        run: |
          mkdir -p artifacts/p016-gdformat
          cp game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd artifacts/p016-gdformat/
          cp game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd artifacts/p016-gdformat/
          cp game/tests/drowned_harbor_bellhouse_recovery_test.gd artifacts/p016-gdformat/
          cp game/tests/drowned_harbor_prototype_isolation_test.gd artifacts/p016-gdformat/
          gdformat artifacts/p016-gdformat/*.gd

      - name: Upload canonical P0.16 GDScript copies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p016-gdformat-output
          path: artifacts/p016-gdformat
          if-no-files-found: error
          retention-days: 14

      - name: Remove generated copies and confirm cleanliness
        if: always()
        run: |
          rm -rf artifacts/p016-gdformat
          git diff --exit-code
          test -z "$(git status --porcelain)"
