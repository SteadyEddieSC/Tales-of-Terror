name: Drowned Harbor Bellhouse decision and recovery

on:
  pull_request:
    paths:
      - '.github/workflows/drowned-harbor-bellhouse-recovery.yml'

permissions:
  contents: read

jobs:
  diagnose-validator:
    name: Temporary read-only P0.16 validator diagnosis
    if: github.head_ref == 'agent/p0.16-drowned-harbor-bellhouse-recovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact baseline and branch
        run: |
          test "$GITHUB_HEAD_REF" = "agent/p0.16-drowned-harbor-bellhouse-recovery"
          test "$(git merge-base HEAD origin/main)" = "1d27a1584fc9f8513e9322875477133b77ef8050"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Build corrected validator copy
        run: |
          mkdir -p artifacts/p016-validator-diagnosis
          cp tools/validate_drowned_harbor_bellhouse_recovery.py \
            artifacts/p016-validator-diagnosis/validator.original.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/validate_drowned_harbor_bellhouse_recovery.py')
          text = path.read_text(encoding='utf-8')
          bellhouse_pattern = re.compile(
              r'    require\(\n'
              r'\s+len\(set\(private_strings\(private\)\)\) >= 5,\n'
              r'\s+"Bellhouse fixture must retain private leak sentinels",\n'
              r'\s+\)'
          )
          recovery_pattern = re.compile(
              r'    require\(\n'
              r'\s+len\(set\(private_strings\(private\)\)\) >= 5,\n'
              r'\s+"recovery fixture must retain private leak sentinels",\n'
              r'\s+\)'
          )
          bellhouse_new = (
              "    require(\n"
              "        set(private_strings(private))\n"
              "        == {\n"
              "            \"PRIVATE_BELLMARKED\",\n"
              "            \"PRIVATE_PRESERVE_HARBOR\",\n"
              "            \"PRIVATE_SIXTH_NAME\",\n"
              "        },\n"
              "        \"Bellhouse fixture private leak sentinels drifted\",\n"
              "    )"
          )
          recovery_new = (
              "    require(\n"
              "        set(private_strings(private))\n"
              "        == {\n"
              "            \"PRIVATE_ARCHIVE_ROUTE_RESERVED_FOR_DROWNED_GUIDE\",\n"
              "            \"PRIVATE_FIND_MISSING_NAME\",\n"
              "        },\n"
              "        \"recovery fixture private leak sentinels drifted\",\n"
              "    )"
          )
          text, bellhouse_count = bellhouse_pattern.subn(bellhouse_new, text, count=1)
          text, recovery_count = recovery_pattern.subn(recovery_new, text, count=1)
          if bellhouse_count != 1 or recovery_count != 1:
              raise SystemExit(
                  f'replacement counts: Bellhouse={bellhouse_count}, recovery={recovery_count}'
              )
          path.write_text(text, encoding='utf-8')
          Path('artifacts/p016-validator-diagnosis/validator.corrected.py').write_text(
              text,
              encoding='utf-8',
          )
          PY

      - name: Capture corrected validator and regression outputs
        run: |
          set +e
          python -m py_compile tools/validate_drowned_harbor_bellhouse_recovery.py \
            > artifacts/p016-validator-diagnosis/py-compile.txt 2>&1
          echo "$?" > artifacts/p016-validator-diagnosis/py-compile.status
          python tools/validate_drowned_harbor_bellhouse_recovery.py \
            > artifacts/p016-validator-diagnosis/validator.txt 2>&1
          echo "$?" > artifacts/p016-validator-diagnosis/validator.status
          python tools/test_validate_drowned_harbor_bellhouse_recovery.py \
            > artifacts/p016-validator-diagnosis/regressions.txt 2>&1
          echo "$?" > artifacts/p016-validator-diagnosis/regressions.status
          set -e

      - name: Upload P0.16 validator diagnosis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p016-validator-diagnosis
          path: artifacts/p016-validator-diagnosis
          if-no-files-found: error
          retention-days: 14

      - name: Remove generated evidence and confirm cleanliness
        if: always()
        run: |
          git checkout -- tools/validate_drowned_harbor_bellhouse_recovery.py
          rm -rf artifacts/p016-validator-diagnosis tools/__pycache__
          git diff --exit-code
          test -z "$(git status --porcelain)"
