name: Drowned Harbor Bellhouse decision and recovery

on:
  pull_request:
    paths:
      - '.github/workflows/drowned-harbor-bellhouse-recovery.yml'

permissions:
  contents: read

jobs:
  diagnose-standalone:
    name: Temporary read-only P0.16 standalone diagnosis
    if: github.head_ref == 'agent/p0.16-drowned-harbor-bellhouse-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact baseline and branch
        run: |
          test "$GITHUB_HEAD_REF" = "agent/p0.16-drowned-harbor-bellhouse-recovery"
          test "$(git merge-base HEAD origin/main)" = "1d27a1584fc9f8513e9322875477133b77ef8050"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Build standalone-safe candidate copies
        run: |
          mkdir -p artifacts/p016-standalone-diagnosis
          cp game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd \
            artifacts/p016-standalone-diagnosis/adapter.original.gd
          cp game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd \
            artifacts/p016-standalone-diagnosis/shell.original.gd
          cp game/tests/drowned_harbor_bellhouse_recovery_test.gd \
            artifacts/p016-standalone-diagnosis/test.original.gd
          python - <<'PY'
          from pathlib import Path

          shell_path = Path(
              'game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd'
          )
          shell = shell_path.read_text(encoding='utf-8')
          replacements = {
              'var _adapter: DrownedHarborBellhouseFixtureAdapter = ADAPTER_SCRIPT.new()':
                  'var _adapter = ADAPTER_SCRIPT.new()',
              'path: String = DrownedHarborBellhouseFixtureAdapter.FIXTURE_PATH':
                  'path: String = "res://tests/drowned_harbor_dev_only/state_projection_fixtures_v1.json"',
          }
          for old, new in replacements.items():
              if shell.count(old) != 1:
                  raise SystemExit(f'shell source count for {old!r}: {shell.count(old)}')
              shell = shell.replace(old, new, 1)
          shell_path.write_text(shell, encoding='utf-8')

          test_path = Path('game/tests/drowned_harbor_bellhouse_recovery_test.gd')
          test = test_path.read_text(encoding='utf-8')
          adapter_type = ': DrownedHarborBellhouseFixtureAdapter'
          shell_type = ': DrownedHarborBellhouseDecisionShell'
          shell_return = ' -> DrownedHarborBellhouseDecisionShell'
          if test.count(adapter_type) != 3:
              raise SystemExit(f'adapter type count: {test.count(adapter_type)}')
          if test.count(shell_type) < 5:
              raise SystemExit(f'shell variable type count: {test.count(shell_type)}')
          if test.count(shell_return) != 1:
              raise SystemExit(f'shell return type count: {test.count(shell_return)}')
          test = test.replace(adapter_type, '')
          test = test.replace(shell_type, '')
          test = test.replace(shell_return, '')
          scene_check = 'instance is DrownedHarborBellhouseDecisionShell'
          if test.count(scene_check) != 1:
              raise SystemExit(f'scene type check count: {test.count(scene_check)}')
          test = test.replace(scene_check, 'instance.get_script() == SHELL_SCRIPT', 1)
          test_path.write_text(test, encoding='utf-8')
          PY
          cp game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd \
            artifacts/p016-standalone-diagnosis/shell.candidate.gd
          cp game/tests/drowned_harbor_bellhouse_recovery_test.gd \
            artifacts/p016-standalone-diagnosis/test.candidate.gd

      - name: Install pinned GDScript Toolkit
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-dev.txt
          python -m pip check
          gdformat game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd \
            game/tests/drowned_harbor_bellhouse_recovery_test.gd
          gdformat --check game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd \
            game/tests/drowned_harbor_bellhouse_recovery_test.gd
          gdlint game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd \
            game/tests/drowned_harbor_bellhouse_recovery_test.gd

      - name: Download checksum-pinned Godot 4.7.1 stable
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable
          curl -fsSL -o godot.zip "$base/Godot_v4.7.1-stable_linux.x86_64.zip"
          echo '4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9  godot.zip' | sha512sum --check -
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64

      - name: Capture separate Godot parser and test outputs
        run: |
          set +e
          godot=.godot-bin/Godot_v4.7.1-stable_linux.x86_64
          "$godot" --headless --editor --path game --quit \
            > artifacts/p016-standalone-diagnosis/import.txt 2>&1
          echo "$?" > artifacts/p016-standalone-diagnosis/import.status
          "$godot" --headless --path game \
            --script res://tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd \
            > artifacts/p016-standalone-diagnosis/adapter-script.txt 2>&1
          echo "$?" > artifacts/p016-standalone-diagnosis/adapter-script.status
          "$godot" --headless --path game \
            --script res://tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd \
            > artifacts/p016-standalone-diagnosis/shell-script.txt 2>&1
          echo "$?" > artifacts/p016-standalone-diagnosis/shell-script.status
          "$godot" --headless --path game \
            --script res://tests/drowned_harbor_bellhouse_recovery_test.gd \
            > artifacts/p016-standalone-diagnosis/bellhouse-test.txt 2>&1
          echo "$?" > artifacts/p016-standalone-diagnosis/bellhouse-test.status
          set -e

      - name: Upload standalone diagnosis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p016-standalone-diagnosis
          path: artifacts/p016-standalone-diagnosis
          if-no-files-found: error
          retention-days: 14

      - name: Restore source and confirm cleanliness
        if: always()
        run: |
          git checkout -- \
            game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd \
            game/tests/drowned_harbor_bellhouse_recovery_test.gd
          rm -rf artifacts/p016-standalone-diagnosis .godot-bin godot.zip
          git diff --exit-code
          test -z "$(git status --porcelain)"
