name: Drowned Harbor Bellhouse decision and recovery

on:
  pull_request:
    paths:
      - '.github/workflows/drowned-harbor-bellhouse-recovery.yml'

permissions:
  contents: write

jobs:
  fix-validator:
    name: Temporary bounded P0.16 validator correction
    if: >-
      github.head_ref == 'agent/p0.16-drowned-harbor-bellhouse-recovery' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact baseline and branch
        run: |
          test "$GITHUB_HEAD_REF" = "agent/p0.16-drowned-harbor-bellhouse-recovery"
          test "$(git merge-base HEAD origin/main)" = "1d27a1584fc9f8513e9322875477133b77ef8050"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Correct exact private-sentinel assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/validate_drowned_harbor_bellhouse_recovery.py')
          text = path.read_text(encoding='utf-8')
          bellhouse_pattern = re.compile(
              r'    require\(\n'
              r'\s+len\(set\(private_strings\(private\)\)\) >= 5,\n'
              r'\s+"Bellhouse fixture must retain private leak sentinels",\n'
              r'\s+\)'
          )
          recovery_pattern = re.compile(
              r'    require\(\n'
              r'\s+len\(set\(private_strings\(private\)\)\) >= 5,\n'
              r'\s+"recovery fixture must retain private leak sentinels",\n'
              r'\s+\)'
          )
          bellhouse_new = (
              "    require(\n"
              "        set(private_strings(private))\n"
              "        == {\n"
              "            \"PRIVATE_BELLMARKED\",\n"
              "            \"PRIVATE_PRESERVE_HARBOR\",\n"
              "            \"PRIVATE_SIXTH_NAME\",\n"
              "        },\n"
              "        \"Bellhouse fixture private leak sentinels drifted\",\n"
              "    )"
          )
          recovery_new = (
              "    require(\n"
              "        set(private_strings(private))\n"
              "        == {\n"
              "            \"PRIVATE_ARCHIVE_ROUTE_RESERVED_FOR_DROWNED_GUIDE\",\n"
              "            \"PRIVATE_FIND_MISSING_NAME\",\n"
              "        },\n"
              "        \"recovery fixture private leak sentinels drifted\",\n"
              "    )"
          )
          text, bellhouse_count = bellhouse_pattern.subn(bellhouse_new, text, count=1)
          text, recovery_count = recovery_pattern.subn(recovery_new, text, count=1)
          if bellhouse_count != 1:
              raise SystemExit(f'Bellhouse sentinel replacement count: {bellhouse_count}')
          if recovery_count != 1:
              raise SystemExit(f'recovery sentinel replacement count: {recovery_count}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate bounded correction
        run: |
          python -m py_compile tools/validate_drowned_harbor_bellhouse_recovery.py
          python tools/validate_drowned_harbor_bellhouse_recovery.py
          python tools/test_validate_drowned_harbor_bellhouse_recovery.py
          python - <<'PY'
          import subprocess
          changed = {
              line for line in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines() if line
          }
          expected = {'tools/validate_drowned_harbor_bellhouse_recovery.py'}
          if changed != expected:
              raise SystemExit(f'unexpected changed paths: {sorted(changed)}')
          PY

      - name: Commit exact validator correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate_drowned_harbor_bellhouse_recovery.py
          git commit -m "Correct P0.16 private sentinel assertions"
          git push origin "HEAD:$GITHUB_HEAD_REF"
