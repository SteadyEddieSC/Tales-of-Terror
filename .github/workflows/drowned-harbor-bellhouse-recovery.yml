name: Drowned Harbor Bellhouse decision and recovery

on:
  pull_request:
    paths:
      - '.github/workflows/drowned-harbor-bellhouse-recovery.yml'

permissions:
  contents: write

jobs:
  apply-final-contract:
    name: Temporary bounded final P0.16 contract correction
    if: >-
      github.head_ref == 'agent/p0.16-drowned-harbor-bellhouse-recovery' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact baseline and branch
        run: |
          test "$GITHUB_HEAD_REF" = "agent/p0.16-drowned-harbor-bellhouse-recovery"
          test "$(git merge-base HEAD origin/main)" = "1d27a1584fc9f8513e9322875477133b77ef8050"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Apply final corrected and hardened contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          validator_path = Path('tools/validate_drowned_harbor_bellhouse_recovery.py')
          text = validator_path.read_text(encoding='utf-8')

          sentinel_replacements = [
              (
                  re.compile(
                      r'    require\(\n'
                      r'\s+len\(set\(private_strings\(private\)\)\) >= 5,\n'
                      r'\s+"Bellhouse fixture must retain private leak sentinels",\n'
                      r'\s+\)'
                  ),
                  (
                      "    require(\n"
                      "        set(private_strings(private))\n"
                      "        == {\n"
                      "            \"PRIVATE_BELLMARKED\",\n"
                      "            \"PRIVATE_PRESERVE_HARBOR\",\n"
                      "            \"PRIVATE_SIXTH_NAME\",\n"
                      "        },\n"
                      "        \"Bellhouse fixture private leak sentinels drifted\",\n"
                      "    )"
                  ),
                  'Bellhouse sentinels',
              ),
              (
                  re.compile(
                      r'    require\(\n'
                      r'\s+len\(set\(private_strings\(private\)\)\) >= 5,\n'
                      r'\s+"recovery fixture must retain private leak sentinels",\n'
                      r'\s+\)'
                  ),
                  (
                      "    require(\n"
                      "        set(private_strings(private))\n"
                      "        == {\n"
                      "            \"PRIVATE_ARCHIVE_ROUTE_RESERVED_FOR_DROWNED_GUIDE\",\n"
                      "            \"PRIVATE_FIND_MISSING_NAME\",\n"
                      "        },\n"
                      "        \"recovery fixture private leak sentinels drifted\",\n"
                      "    )"
                  ),
                  'recovery sentinels',
              ),
          ]
          for pattern, replacement, label in sentinel_replacements:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label} replacement count: {count}')

          shell_anchor = (
              "    require(\n"
              "        'path=\"res://tests/drowned_harbor_dev_only/'\n"
              "        'bellhouse_decision_shell.gd\"' in scene,\n"
              "        \"scene does not use the bounded Bellhouse shell script\",\n"
              "    )"
          )
          shell_assertions = (
              "    require(\n"
              "        shell.count(\"_commit_count = 1\") == 1,\n"
              "        \"shell must contain exactly one exactly-once commit assignment\",\n"
              "    )\n"
              "    require(\n"
              "        shell.count('\"production_authority\": false') == 1,\n"
              "        \"shell production-authority denial drifted\",\n"
              "    )\n"
              "    require(\n"
              "        shell.count('\"stable_seat_reset\": false') == 1,\n"
              "        \"shell stable-seat preservation marker drifted\",\n"
              "    )\n\n"
              + shell_anchor
          )
          if text.count(shell_anchor) != 1:
              raise SystemExit(f'shell assertion anchor count: {text.count(shell_anchor)}')
          text = text.replace(shell_anchor, shell_assertions, 1)

          docs_anchor = (
              '            require(phrase.lower() in text.lower(), '
              'f"{path} missing phrase: {phrase}")'
          )
          docs_assertions = (
              docs_anchor
              + "\n        if path == TECHNICAL_PATH:\n"
              "            require(\n"
              "                \"physical-controller evidence\" in text.lower(),\n"
              "                \"technical contract missing exact physical-controller evidence phrase\",\n"
              "            )\n"
              "        if path == SUMMARY_PATH:\n"
              "            require(\n"
              "                text.startswith(\"# P0.16 —\"),\n"
              "                \"release summary heading must retain the exact P0.16 identity\",\n"
              "            )"
          )
          if text.count(docs_anchor) != 1:
              raise SystemExit(f'documentation assertion anchor count: {text.count(docs_anchor)}')
          text = text.replace(docs_anchor, docs_assertions, 1)
          validator_path.write_text(text, encoding='utf-8')

          technical_path = Path(
              'docs/technical/Drowned_Harbor_Bellhouse_Decision_Recovery_v1.md'
          )
          technical = technical_path.read_text(encoding='utf-8')
          technical_old = (
              'This is not a production reducer, production save, final Ledger '
              'mechanic, or balance commitment.'
          )
          technical_new = (
              'No production authority is created. This is not a production '
              'reducer, production save, final Ledger mechanic, or balance commitment.'
          )
          if technical.count(technical_old) != 1:
              raise SystemExit('technical production-authority source drifted')
          technical_path.write_text(
              technical.replace(technical_old, technical_new, 1),
              encoding='utf-8',
          )

          summary_path = Path('docs/preproduction/P0.16_Release_Summary.md')
          summary = summary_path.read_text(encoding='utf-8')
          summary_old = 'The event is not production gameplay authority.'
          summary_new = (
              'The event is not production gameplay authority. '
              'No production authority is created.'
          )
          if summary.count(summary_old) != 1:
              raise SystemExit('summary production-authority source drifted')
          summary_path.write_text(
              summary.replace(summary_old, summary_new, 1),
              encoding='utf-8',
          )
          PY

      - name: Validate final corrected contract
        run: |
          python -m py_compile tools/validate_drowned_harbor_bellhouse_recovery.py
          python tools/validate_drowned_harbor_bellhouse_recovery.py
          python tools/test_validate_drowned_harbor_bellhouse_recovery.py
          python - <<'PY'
          import subprocess
          changed = {
              line for line in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines() if line
          }
          expected = {
              'docs/preproduction/P0.16_Release_Summary.md',
              'docs/technical/Drowned_Harbor_Bellhouse_Decision_Recovery_v1.md',
              'tools/validate_drowned_harbor_bellhouse_recovery.py',
          }
          if changed != expected:
              raise SystemExit(
                  f'final contract path mismatch: '
                  f'missing={sorted(expected - changed)}; '
                  f'unexpected={sorted(changed - expected)}'
              )
          PY

      - name: Commit final corrected contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/preproduction/P0.16_Release_Summary.md \
            docs/technical/Drowned_Harbor_Bellhouse_Decision_Recovery_v1.md \
            tools/validate_drowned_harbor_bellhouse_recovery.py
          git commit -m "Harden P0.16 validator and authority boundaries"
          git push origin "HEAD:$GITHUB_HEAD_REF"
