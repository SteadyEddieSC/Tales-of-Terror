name: Drowned Harbor Bellhouse decision and recovery

on:
  pull_request:
    paths:
      - '.github/workflows/drowned-harbor-bellhouse-recovery.yml'

permissions:
  contents: read

jobs:
  diagnose:
    name: Temporary read-only P0.16 lint evidence
    if: github.head_ref == 'agent/p0.16-drowned-harbor-bellhouse-recovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact protected-main baseline and branch
        run: |
          test "$GITHUB_HEAD_REF" = "agent/p0.16-drowned-harbor-bellhouse-recovery"
          test "$(git merge-base HEAD origin/main)" = "1d27a1584fc9f8513e9322875477133b77ef8050"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Install pinned GDScript Toolkit
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-dev.txt
          python -m pip check

      - name: Build formatted semantic copies
        run: |
          mkdir -p artifacts/p016-lint
          cp game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd artifacts/p016-lint/
          cp game/tests/drowned_harbor_dev_only/bellhouse_decision_shell.gd artifacts/p016-lint/
          cp game/tests/drowned_harbor_bellhouse_recovery_test.gd artifacts/p016-lint/
          cp game/tests/drowned_harbor_prototype_isolation_test.gd artifacts/p016-lint/
          python - <<'PY'
          from pathlib import Path

          root = Path('artifacts/p016-lint')
          shell_path = root / 'bellhouse_decision_shell.gd'
          shell = shell_path.read_text(encoding='utf-8')
          if 'current_options: Array = []' not in shell:
              shell = shell.replace(
                  '\tcurrent_option: String,\n) -> Dictionary:',
                  '\tcurrent_option: String,\n\tcurrent_options: Array = [],\n) -> Dictionary:',
                  1,
              )
              shell = shell.replace(
                  '\tvar message: String = ""\n\tif _commit_count > 0:',
                  '\tvar message: String = ""\n'
                  '\tvar available_options: Array = (\n'
                  '\t\tcurrent_options.duplicate(true)\n'
                  '\t\tif not current_options.is_empty()\n'
                  '\t\telse decision_options()\n'
                  '\t)\n'
                  '\tif _commit_count > 0:',
                  1,
              )
              shell = shell.replace(
                  '\telif current_option != _pending_confirmation.get("option"):\n'
                  '\t\tcode = "changed_confirmation_option"\n'
                  '\t\tmessage = "The selected option changed. Review the current public consequence."\n'
                  '\telif not decision_options().has(current_option):\n'
                  '\t\tcode = "unavailable_confirmation_option"\n'
                  '\t\tmessage = "That option is unavailable. Current legal options are shown."',
                  '\telif not available_options.has(current_option):\n'
                  '\t\tcode = "unavailable_confirmation_option"\n'
                  '\t\tmessage = "That option is unavailable. Current legal options are shown."\n'
                  '\telif current_option != _pending_confirmation.get("option"):\n'
                  '\t\tcode = "changed_confirmation_option"\n'
                  '\t\tmessage = "The selected option changed. Review the current public consequence."',
                  1,
              )
          if 'const COMMITTED_STATUS:' not in shell:
              shell = shell.replace(
                  'const CONFIRM_ACTORS: PackedStringArray = ["active_stable_seat"]\n',
                  'const CONFIRM_ACTORS: PackedStringArray = ["active_stable_seat"]\n'
                  'const COMMITTED_STATUS: PackedStringArray = [\n'
                  '\t"Prototype decision recorded once.",\n'
                  '\t"No production gameplay authority was created.",\n'
                  ']\n'
                  'const CANCEL_STATUS: PackedStringArray = [\n'
                  '\t"Cancelled.",\n'
                  '\t"Fixture state, stable seat, RNG, and committed count are unchanged.",\n'
                  ']\n'
                  'const FIXTURE_RECOVERY_STATUS: PackedStringArray = [\n'
                  '\t"Independent DH-FIX-006 recovery projection.",\n'
                  '\t"Bellhouse fixture state is unchanged.",\n'
                  ']\n',
                  1,
              )
          shell = shell.replace(
              '_status_message = ("Prototype decision recorded once. No production gameplay authority was created.")',
              '_status_message = " ".join(COMMITTED_STATUS)',
          )
          shell = shell.replace(
              '_status_message = ("Cancelled. Fixture state, stable seat, RNG, and committed count are unchanged.")',
              '_status_message = " ".join(CANCEL_STATUS)',
          )
          shell = shell.replace(
              '_status_message = ("Independent DH-FIX-006 recovery projection. Bellhouse fixture state is unchanged.")',
              '_status_message = " ".join(FIXTURE_RECOVERY_STATUS)',
          )
          shell_path.write_text(shell, encoding='utf-8')

          test_path = root / 'drowned_harbor_bellhouse_recovery_test.gd'
          test = test_path.read_text(encoding='utf-8')
          if '"unavailable_confirmation_option"' not in test:
              test = test.replace(
                  '\t_assert_confirmation_failure(\n'
                  '\t\t"changed_confirmation_option",\n'
                  '\t\t21,\n'
                  '\t\t"seat_02",\n'
                  '\t\t"active_stable_seat",\n'
                  '\t\t"unavailable_priority",\n'
                  '\t)',
                  '\t_assert_confirmation_failure(\n'
                  '\t\t"unavailable_confirmation_option",\n'
                  '\t\t21,\n'
                  '\t\t"seat_02",\n'
                  '\t\t"active_stable_seat",\n'
                  '\t\t"unavailable_priority",\n'
                  '\t)\n'
                  '\t_assert_confirmation_failure(\n'
                  '\t\t"changed_confirmation_option",\n'
                  '\t\t21,\n'
                  '\t\t"seat_02",\n'
                  '\t\t"active_stable_seat",\n'
                  '\t\t"alternate_public_priority",\n'
                  '\t\t["record_missing_position", "alternate_public_priority"],\n'
                  '\t)',
                  1,
              )
              test = test.replace(
                  '\tactor_kind: String,\n\toption: String,\n) -> void:',
                  '\tactor_kind: String,\n\toption: String,\n'
                  '\tcurrent_options: Array = [],\n) -> void:',
                  1,
              )
              test = test.replace(
                  '\t\tactor_kind,\n\t\toption,\n\t)',
                  '\t\tactor_kind,\n\t\toption,\n\t\tcurrent_options,\n\t)',
                  1,
              )
          test_path.write_text(test, encoding='utf-8')
          PY
          gdformat artifacts/p016-lint/*.gd

      - name: Capture lint and line-length evidence
        run: |
          set +e
          gdlint artifacts/p016-lint/*.gd > artifacts/p016-lint/gdlint.txt 2>&1
          echo "$?" > artifacts/p016-lint/gdlint-status.txt
          set -e
          python - <<'PY' > artifacts/p016-lint/line-lengths.txt
          from pathlib import Path
          for path in sorted(Path('artifacts/p016-lint').glob('*.gd')):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if len(line) > 100:
                      print(f'{path.name}:{number}:{len(line)}:{line}')
          PY

      - name: Upload P0.16 lint evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p016-lint-evidence
          path: artifacts/p016-lint
          if-no-files-found: error
          retention-days: 14

      - name: Remove generated evidence and confirm cleanliness
        if: always()
        run: |
          rm -rf artifacts/p016-lint
          git diff --exit-code
          test -z "$(git status --porcelain)"
