name: Drowned Harbor Bellhouse decision and recovery

on:
  pull_request:
    paths:
      - '.github/workflows/drowned-harbor-bellhouse-recovery.yml'

permissions:
  contents: write

jobs:
  fix-adapter-syntax:
    name: Temporary bounded P0.16 adapter syntax correction
    if: >-
      github.head_ref == 'agent/p0.16-drowned-harbor-bellhouse-recovery' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact baseline and branch
        run: |
          test "$GITHUB_HEAD_REF" = "agent/p0.16-drowned-harbor-bellhouse-recovery"
          test "$(git merge-base HEAD origin/main)" = "1d27a1584fc9f8513e9322875477133b77ef8050"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Correct invalid GDScript boolean identity syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path(
              'game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd'
          )
          text = path.read_text(encoding='utf-8')
          invalid = ' is not false'
          if text.count(invalid) != 3:
              raise SystemExit(f'invalid boolean identity count: {text.count(invalid)}')
          text = text.replace(invalid, ' != false')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install pinned GDScript Toolkit
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-dev.txt
          python -m pip check

      - name: Canonicalize and lint corrected adapter
        run: |
          gdformat game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd
          gdformat --check game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd
          gdlint game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd

      - name: Validate all P0.16 Python contracts
        run: |
          python tools/validate_drowned_harbor_bellhouse_recovery.py
          python tools/test_validate_drowned_harbor_bellhouse_recovery.py
          python tools/validate_drowned_harbor_low_tide_shell_p016.py
          python tools/test_validate_drowned_harbor_low_tide_shell_p016.py
          python tools/validate_drowned_harbor_projection_fixtures_p016.py
          python tools/test_validate_drowned_harbor_projection_fixtures_p016.py
          python tools/validate_drowned_harbor_prototype_isolation_p016.py
          python tools/test_validate_drowned_harbor_prototype_isolation_p016.py

      - name: Download checksum-pinned Godot 4.7.1 stable
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable
          curl -fsSL -o godot.zip "$base/Godot_v4.7.1-stable_linux.x86_64.zip"
          echo '4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9  godot.zip' | sha512sum --check -
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64

      - name: Validate typed import and standalone suites
        run: |
          set -o pipefail
          godot=.godot-bin/Godot_v4.7.1-stable_linux.x86_64
          "$godot" --headless --editor --path game --quit
          "$godot" --headless --path game \
            --script res://tests/drowned_harbor_bellhouse_recovery_test.gd
          "$godot" --headless --path game \
            --script res://tests/drowned_harbor_low_tide_shell_test.gd
          "$godot" --headless --path game \
            --script res://tests/drowned_harbor_prototype_isolation_test.gd

      - name: Enforce exact correction path
        run: |
          python - <<'PY'
          import subprocess
          changed = {
              line for line in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines() if line
          }
          expected = {
              'game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd'
          }
          if changed != expected:
              raise SystemExit(
                  f'adapter correction path mismatch: '
                  f'missing={sorted(expected - changed)}; '
                  f'unexpected={sorted(changed - expected)}'
              )
          PY

      - name: Commit adapter syntax correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/tests/drowned_harbor_dev_only/bellhouse_fixture_adapter.gd
          git commit -m "Correct P0.16 adapter boolean syntax"
          git push origin "HEAD:$GITHUB_HEAD_REF"
