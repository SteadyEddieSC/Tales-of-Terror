name: Drowned Harbor Bellhouse decision and recovery

on:
  pull_request:
    paths:
      - '.github/workflows/drowned-harbor-bellhouse-recovery.yml'

permissions:
  contents: write

jobs:
  fix-validator:
    name: Temporary bounded P0.16 validator correction
    if: >-
      github.head_ref == 'agent/p0.16-drowned-harbor-bellhouse-recovery' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact baseline and branch
        run: |
          test "$GITHUB_HEAD_REF" = "agent/p0.16-drowned-harbor-bellhouse-recovery"
          test "$(git merge-base HEAD origin/main)" = "1d27a1584fc9f8513e9322875477133b77ef8050"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Correct exact private-sentinel assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/validate_drowned_harbor_bellhouse_recovery.py')
          text = path.read_text(encoding='utf-8')
          bellhouse_old = '''    require(
              len(set(private_strings(private))) >= 5,
              "Bellhouse fixture must retain private leak sentinels",
          )'''
          bellhouse_new = '''    require(
              set(private_strings(private))
              == {
                  "PRIVATE_BELLMARKED",
                  "PRIVATE_PRESERVE_HARBOR",
                  "PRIVATE_SIXTH_NAME",
              },
              "Bellhouse fixture private leak sentinels drifted",
          )'''
          recovery_old = '''    require(
              len(set(private_strings(private))) >= 5,
              "recovery fixture must retain private leak sentinels",
          )'''
          recovery_new = '''    require(
              set(private_strings(private))
              == {
                  "PRIVATE_ARCHIVE_ROUTE_RESERVED_FOR_DROWNED_GUIDE",
                  "PRIVATE_FIND_MISSING_NAME",
              },
              "recovery fixture private leak sentinels drifted",
          )'''
          if text.count(bellhouse_old) != 1:
              raise SystemExit('Bellhouse sentinel assertion source drifted')
          if text.count(recovery_old) != 1:
              raise SystemExit('recovery sentinel assertion source drifted')
          text = text.replace(bellhouse_old, bellhouse_new, 1)
          text = text.replace(recovery_old, recovery_new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate bounded correction
        run: |
          python tools/validate_drowned_harbor_bellhouse_recovery.py
          python tools/test_validate_drowned_harbor_bellhouse_recovery.py
          python - <<'PY'
          import subprocess
          changed = {
              line for line in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines() if line
          }
          expected = {'tools/validate_drowned_harbor_bellhouse_recovery.py'}
          if changed != expected:
              raise SystemExit(f'unexpected changed paths: {sorted(changed)}')
          PY

      - name: Commit exact validator correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate_drowned_harbor_bellhouse_recovery.py
          git commit -m "Correct P0.16 private sentinel assertions"
          git push origin "HEAD:$GITHUB_HEAD_REF"
