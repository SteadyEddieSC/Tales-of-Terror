name: Drowned Harbor prototype automation and export exclusion

on:
  pull_request:
    paths:
      - '.github/workflows/drowned-harbor-prototype-automation.yml'
      - '.github/workflows/godot-tests.yml'
      - '.github/workflows/portable-builds.yml'
      - 'docs/preproduction/P0.19_Release_Summary.md'
      - 'docs/technical/Drowned_Harbor_Prototype_Automation_Export_Exclusion_v1.md'
      - 'game/tests/drowned_harbor_prototype_automation_test.gd'
      - 'game/tests/drowned_harbor_prototype_automation_test.gd.uid'
      - 'game/tests/drowned_harbor_dev_only/**'
      - 'game/tests/drowned_harbor_prototype_isolation_test.gd'
      - 'game/tests/drowned_harbor_prototype_manifest_v1.json'
      - 'game/tests/drowned_harbor_*test.gd'
      - 'game/data/tales/tale_catalog_v1.json'
      - 'game/data/tales/lantern_house/tale_package_v1.json'
      - 'game/src/session/tale_provider_registry.gd'
      - 'game/export_presets.cfg'
      - 'game/project.godot'
      - 'tools/validate_drowned_harbor*.py'
      - 'tools/test_validate_drowned_harbor*.py'
      - 'tools/portable_bundle.py'
      - 'tools/test_portable_bundle.py'
  push:
    branches: [main, agent/p0.19-drowned-harbor-prototype-automation]
    paths:
      - '.github/workflows/drowned-harbor-prototype-automation.yml'
      - '.github/workflows/godot-tests.yml'
      - '.github/workflows/portable-builds.yml'
      - 'docs/preproduction/P0.19_Release_Summary.md'
      - 'docs/technical/Drowned_Harbor_Prototype_Automation_Export_Exclusion_v1.md'
      - 'game/tests/drowned_harbor_prototype_automation_test.gd'
      - 'game/tests/drowned_harbor_prototype_automation_test.gd.uid'
      - 'game/tests/drowned_harbor_dev_only/**'
      - 'game/tests/drowned_harbor_prototype_isolation_test.gd'
      - 'game/tests/drowned_harbor_prototype_manifest_v1.json'
      - 'game/tests/drowned_harbor_*test.gd'
      - 'game/data/tales/tale_catalog_v1.json'
      - 'game/data/tales/lantern_house/tale_package_v1.json'
      - 'game/src/session/tale_provider_registry.gd'
      - 'game/export_presets.cfg'
      - 'game/project.godot'
      - 'tools/validate_drowned_harbor*.py'
      - 'tools/test_validate_drowned_harbor*.py'
      - 'tools/portable_bundle.py'
      - 'tools/test_portable_bundle.py'

permissions:
  contents: read

jobs:
  automation:
    name: Aggregate deterministic matrix and export boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enforce exact P0.19 release boundary
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'agent/p0.19-drowned-harbor-prototype-automation'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          python - <<'PY'
          import os
          import subprocess

          expected = {
              '.github/workflows/drowned-harbor-prototype-automation.yml',
              '.github/workflows/godot-tests.yml',
              '.github/workflows/portable-builds.yml',
              'docs/preproduction/P0.19_Release_Summary.md',
              'docs/technical/Drowned_Harbor_Prototype_Automation_Export_Exclusion_v1.md',
              'game/tests/drowned_harbor_prototype_automation_test.gd',
              'game/tests/drowned_harbor_prototype_automation_test.gd.uid',
              'game/tests/drowned_harbor_dev_only/prototype_automation_profile_v1.json',
              'game/tests/drowned_harbor_dev_only/README.md',
              'game/tests/drowned_harbor_prototype_isolation_test.gd',
              'game/tests/drowned_harbor_prototype_manifest_v1.json',
              'tools/validate_drowned_harbor_prototype_automation.py',
              'tools/test_validate_drowned_harbor_prototype_automation.py',
              'tools/validate_drowned_harbor_high_water_transformation.py',
              'tools/validate_drowned_harbor_controlled_private_shield.py',
              'tools/validate_drowned_harbor_bellhouse_recovery.py',
              'tools/validate_drowned_harbor_low_tide_shell_p016.py',
              'tools/validate_drowned_harbor_projection_fixtures_p016.py',
              'tools/validate_drowned_harbor_prototype_isolation_p016.py',
          }
          output = subprocess.check_output(
              ['git', 'diff', '--name-only', f"origin/{os.environ['BASE_REF']}...HEAD"],
              text=True,
          )
          actual = {line for line in output.splitlines() if line}
          if actual != expected:
              raise SystemExit(
                  'P0.19 path boundary mismatch; '
                  f'missing={sorted(expected - actual)}; '
                  f'unexpected={sorted(actual - expected)}'
              )
          print('Validated exact 19-path P0.19 release boundary')
          PY

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.9

      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-dev.txt
          python -m pip check

      - name: Validate P0.19 and every inherited Drowned Harbor contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p019-python
          run_check() {
            name="$1"
            shift
            set +e
            "$@" 2>&1 | tee "artifacts/p019-python/${name}.txt"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "artifacts/p019-python/${name}.status"
            if [ "$status" -ne 0 ]; then exit "$status"; fi
          }
          run_check p019-validator python tools/validate_drowned_harbor_prototype_automation.py
          run_check p019-mutations python tools/test_validate_drowned_harbor_prototype_automation.py
          run_check high-water-validator python tools/validate_drowned_harbor_high_water_transformation.py
          run_check high-water-mutations python tools/test_validate_drowned_harbor_high_water_transformation.py
          run_check controlled-private-validator python tools/validate_drowned_harbor_controlled_private_shield.py
          run_check controlled-private-mutations python tools/test_validate_drowned_harbor_controlled_private_shield.py
          run_check bellhouse-validator python tools/validate_drowned_harbor_bellhouse_recovery.py
          run_check bellhouse-mutations python tools/test_validate_drowned_harbor_bellhouse_recovery.py
          run_check low-tide-validator python tools/validate_drowned_harbor_low_tide_shell_p016.py
          run_check low-tide-mutations python tools/test_validate_drowned_harbor_low_tide_shell_p016.py
          run_check projection-validator python tools/validate_drowned_harbor_projection_fixtures_p016.py
          run_check projection-mutations python tools/test_validate_drowned_harbor_projection_fixtures_p016.py
          run_check isolation-validator python tools/validate_drowned_harbor_prototype_isolation_p016.py
          run_check isolation-mutations python tools/test_validate_drowned_harbor_prototype_isolation_p016.py

      - name: Check P0.19 first-party GDScript formatting and lint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p019-gdscript
          gdformat --check \
            game/tests/drowned_harbor_prototype_automation_test.gd \
            game/tests/drowned_harbor_prototype_isolation_test.gd \
            2>&1 | tee artifacts/p019-gdscript/gdformat.txt
          echo "${PIPESTATUS[0]}" > artifacts/p019-gdscript/gdformat.status
          gdlint \
            game/tests/drowned_harbor_prototype_automation_test.gd \
            game/tests/drowned_harbor_prototype_isolation_test.gd \
            2>&1 | tee artifacts/p019-gdscript/gdlint.txt
          echo "${PIPESTATUS[0]}" > artifacts/p019-gdscript/gdlint.status

      - name: Download checksum-pinned Godot 4.7.1 stable
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable
          curl -fsSL -o godot.zip "$base/Godot_v4.7.1-stable_linux.x86_64.zip"
          echo '4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9  godot.zip' | sha512sum --check -
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64
          mkdir -p artifacts/p019-godot

      - name: Run typed import, aggregate matrix, and inherited focused suites
        shell: bash
        run: |
          set -euo pipefail
          godot=.godot-bin/Godot_v4.7.1-stable_linux.x86_64
          run_godot() {
            name="$1"
            shift
            set +e
            "$godot" "$@" 2>&1 | tee "artifacts/p019-godot/${name}.txt"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "artifacts/p019-godot/${name}.status"
            if [ "$status" -ne 0 ]; then exit "$status"; fi
          }
          run_godot typed-import --headless --editor --path game --quit
          run_godot automation-test --headless --path game --script res://tests/drowned_harbor_prototype_automation_test.gd
          run_godot low-tide-test --headless --path game --script res://tests/drowned_harbor_low_tide_shell_test.gd
          run_godot bellhouse-test --headless --path game --script res://tests/drowned_harbor_bellhouse_recovery_test.gd
          run_godot controlled-private-test --headless --path game --script res://tests/drowned_harbor_controlled_private_shield_test.gd
          run_godot high-water-test --headless --path game --script res://tests/drowned_harbor_high_water_transformation_test.gd
          run_godot isolation-test --headless --path game --script res://tests/drowned_harbor_prototype_isolation_test.gd

      - name: Upload P0.19 automation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p019-drowned-harbor-automation-evidence
          path: |
            artifacts/p019-python
            artifacts/p019-gdscript
            artifacts/p019-godot
          if-no-files-found: warn
          retention-days: 14

      - name: Remove generated evidence
        if: always()
        run: rm -rf artifacts/p019-python artifacts/p019-gdscript artifacts/p019-godot .godot-bin godot.zip game/.godot

      - name: Prove repository remains clean
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
