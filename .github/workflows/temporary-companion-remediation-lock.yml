name: Temporary controlled-private indentation repair

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Repair and validate P0.17 mutation indentation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Repair exact indentation defect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/test_validate_drowned_harbor_controlled_private_shield.py')
          text = path.read_text(encoding='utf-8')
          old = '''    validate_manifest_and_production_boundary(
              read_json(ROOT / MANIFEST_PATH),
              read_json(ROOT / "game/data/tales/tale_catalog_v1.json"),
              (ROOT / PROVIDER_PATH).read_text(encoding="utf-8"),
              (ROOT / EXPORT_PRESETS_PATH).read_text(encoding="utf-8"),
              read_json(ROOT / PACKAGE_JSON_PATH),
              read_json(ROOT / PACKAGE_LOCK_PATH),
          )

          mutations: list[tuple[str, Mutation]] = [
          '''
          # The committed defect lost indentation after the opening line.
          defective = '''    validate_manifest_and_production_boundary(
              read_json(ROOT / MANIFEST_PATH),
              read_json(ROOT / "game/data/tales/tale_catalog_v1.json"),
              (ROOT / PROVIDER_PATH).read_text(encoding="utf-8"),
              (ROOT / EXPORT_PRESETS_PATH).read_text(encoding="utf-8"),
              read_json(ROOT / PACKAGE_JSON_PATH),
              read_json(ROOT / PACKAGE_LOCK_PATH),
          )

          mutations: list[tuple[str, Mutation]] = [
          '''
          # Normalize from the actual malformed block regardless of visual dedent in YAML.
          start = text.index('    validate_manifest_and_production_boundary(\n', text.index('def main() -> int:'))
          end = text.index('        ("missing DH-FIX-007"', start)
          repaired = '''    validate_manifest_and_production_boundary(
              read_json(ROOT / MANIFEST_PATH),
              read_json(ROOT / "game/data/tales/tale_catalog_v1.json"),
              (ROOT / PROVIDER_PATH).read_text(encoding="utf-8"),
              (ROOT / EXPORT_PRESETS_PATH).read_text(encoding="utf-8"),
              read_json(ROOT / PACKAGE_JSON_PATH),
              read_json(ROOT / PACKAGE_LOCK_PATH),
          )

          mutations: list[tuple[str, Mutation]] = [
          '''
          # Rebuild with explicit four-space function indentation.
          lines = [
              '    validate_manifest_and_production_boundary(',
              '        read_json(ROOT / MANIFEST_PATH),',
              '        read_json(ROOT / "game/data/tales/tale_catalog_v1.json"),',
              '        (ROOT / PROVIDER_PATH).read_text(encoding="utf-8"),',
              '        (ROOT / EXPORT_PRESETS_PATH).read_text(encoding="utf-8"),',
              '        read_json(ROOT / PACKAGE_JSON_PATH),',
              '        read_json(ROOT / PACKAGE_LOCK_PATH),',
              '    )',
              '',
              '    mutations: list[tuple[str, Mutation]] = [',
          ]
          text = text[:start] + '\n'.join(lines) + '\n' + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Compile and execute controlled-private validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/test_validate_drowned_harbor_controlled_private_shield.py
          python tools/validate_drowned_harbor_controlled_private_shield.py
          python tools/test_validate_drowned_harbor_controlled_private_shield.py
      - name: Commit repaired mutation suite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/test_validate_drowned_harbor_controlled_private_shield.py
          git commit -m "Fix controlled-private mutation suite indentation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
