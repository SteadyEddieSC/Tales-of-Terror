name: Temporary Companion remediation lock synthesis

on:
  pull_request:
  push:
    branches:
      - feature/v0.2.0-alpha.3-systems-replayability
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize-and-prove:
    name: Generate lock, prove compatibility, and finalize boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Generate candidate lockfile from authorized overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Install generated locked dependencies
        run: npm ci
      - name: Prove patched dependency identities
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const postcss = lock.packages['node_modules/postcss']?.version;
          const undici = lock.packages['node_modules/undici']?.version;
          if (postcss !== '8.5.23') throw new Error(`unexpected postcss ${postcss}`);
          if (undici !== '7.29.0') throw new Error(`unexpected undici ${undici}`);
          console.log(JSON.stringify({ postcss, undici }));
          NODE
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate
      - name: Strict TypeScript validation
        run: npm run typecheck
      - name: Protocol service browser privacy and accessibility tests
        run: npm test
      - name: Worker and browser production builds
        run: npm run build
      - name: Local Worker and Durable Object emulation smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:service -- --port 8787 > /tmp/terror-turn-room.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/v1/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          value=json.load(open('/tmp/health.json', encoding='utf-8'))
          assert value == {'status': 'ok', 'serviceVersion': '0.0.9'}, value
          PY
          curl -fsS -X POST http://127.0.0.1:8787/v1/rooms > /tmp/room.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/room.json', encoding='utf-8'))
          assert value['accepted'] is True
          assert len(value['joinCode']) == 6
          assert value['joinCode'] != value['hostCapability']
          PY
      - name: Apply bounded inherited-validator and path-boundary cleanup
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old!r}')
              target.write_text(text.replace(old, new, count), encoding='utf-8')

          validator = 'tools/validate_drowned_harbor_controlled_private_shield.py'
          replace_exact(
              validator,
              '    require("overrides" not in package_json and "resolutions" not in package_json, "override prohibited")\n',
              '    require(\n'
              '        lock_packages.get("node_modules/postcss", {}).get("version") == "8.5.23",\n'
              '        "lock PostCSS remediation changed",\n'
              '    )\n'
              '    require(\n'
              '        lock_packages.get("node_modules/undici", {}).get("version") == "7.29.0",\n'
              '        "lock Undici remediation changed",\n'
              '    )\n'
              '    require(\n'
              '        package_json.get("overrides")\n'
              '        == {"postcss": "8.5.23", "undici": "7.29.0"},\n'
              '        "approved override set drifted",\n'
              '    )\n'
              '    require("resolutions" not in package_json, "resolutions prohibited")\n',
          )

          mutation_test = 'tools/test_validate_drowned_harbor_controlled_private_shield.py'
          baseline_marker = '    mutations: list[tuple[str, Mutation]] = [\n'
          baseline_block = '''    validate_manifest_and_production_boundary(
              read_json(ROOT / MANIFEST_PATH),
              read_json(ROOT / "game/data/tales/tale_catalog_v1.json"),
              (ROOT / PROVIDER_PATH).read_text(encoding="utf-8"),
              (ROOT / EXPORT_PRESETS_PATH).read_text(encoding="utf-8"),
              read_json(ROOT / PACKAGE_JSON_PATH),
              read_json(ROOT / PACKAGE_LOCK_PATH),
          )

          mutations: list[tuple[str, Mutation]] = [
          '''
          replace_exact(mutation_test, baseline_marker, baseline_block)

          mutation_marker = '''        (
                      "production registration",
          '''
          mutation_block = '''        (
                      "missing approved overrides",
                      lambda: boundary_mutation(
                          lambda _m, _c, _p, _e, j, _l: j.pop("overrides", None)
                      ),
                  ),
                  (
                      "approved PostCSS override drift",
                      lambda: boundary_mutation(
                          lambda _m, _c, _p, _e, j, _l: j["overrides"].__setitem__(
                              "postcss", "8.5.22"
                          )
                      ),
                  ),
                  (
                      "extra override key",
                      lambda: boundary_mutation(
                          lambda _m, _c, _p, _e, j, _l: j["overrides"].__setitem__(
                              "sharp", "0.35.2"
                          )
                      ),
                  ),
                  (
                      "resolutions field introduced",
                      lambda: boundary_mutation(
                          lambda _m, _c, _p, _e, j, _l: j.__setitem__(
                              "resolutions", {"undici": "7.29.0"}
                          )
                      ),
                  ),
                  (
                      "locked PostCSS remediation drift",
                      lambda: boundary_mutation(
                          lambda _m, _c, _p, _e, _j, lock: lock["packages"][
                              "node_modules/postcss"
                          ].__setitem__("version", "8.5.22")
                      ),
                  ),
                  (
                      "locked Undici remediation drift",
                      lambda: boundary_mutation(
                          lambda _m, _c, _p, _e, _j, lock: lock["packages"][
                              "node_modules/undici"
                          ].__setitem__("version", "7.28.0")
                      ),
                  ),
                  (
                      "direct Sharp dev dependency",
                      lambda: boundary_mutation(
                          lambda _m, _c, _p, _e, j, _l: j["devDependencies"].__setitem__(
                              "sharp", "0.35.2"
                          )
                      ),
                  ),
                  (
                      "production registration",
          '''
          replace_exact(mutation_test, mutation_marker, mutation_block)

          alpha3_validator = 'tools/validate_drowned_harbor_alpha3_systems.py'
          alpha3_marker = '    ".github/workflows/v020-alpha3-systems-replayability.yml",\n'
          alpha3_addition = (
              alpha3_marker
              + '    "package-lock.json",\n'
              + '    "package.json",\n'
              + '    "tools/test_validate_drowned_harbor_controlled_private_shield.py",\n'
              + '    "tools/validate_drowned_harbor_controlled_private_shield.py",\n'
          )
          replace_exact(alpha3_validator, alpha3_marker, alpha3_addition)

          workflow = '.github/workflows/v020-alpha3-systems-replayability.yml'
          yaml_marker = "      - '.github/workflows/v020-alpha3-systems-replayability.yml'\n"
          yaml_addition = (
              yaml_marker
              + "      - 'package-lock.json'\n"
              + "      - 'package.json'\n"
              + "      - 'tools/test_validate_drowned_harbor_controlled_private_shield.py'\n"
              + "      - 'tools/validate_drowned_harbor_controlled_private_shield.py'\n"
          )
          replace_exact(workflow, yaml_marker, yaml_addition, count=2)
          expected_marker = "              '.github/workflows/v020-alpha3-systems-replayability.yml',\n"
          expected_addition = (
              expected_marker
              + "              'package-lock.json',\n"
              + "              'package.json',\n"
              + "              'tools/test_validate_drowned_harbor_controlled_private_shield.py',\n"
              + "              'tools/validate_drowned_harbor_controlled_private_shield.py',\n"
          )
          replace_exact(workflow, expected_marker, expected_addition)
          replace_exact(
              workflow,
              "          print('Validated exact 34-path Alpha.3 protected-base inventory')\n",
              "          print('Validated exact 38-path Alpha.3 protected-base inventory')\n",
          )

          Path('.github/workflows/temporary-companion-remediation-lock.yml').unlink()
          PY
      - name: Commit proven lockfile and bounded cleanup
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes remain."
            exit 0
          fi
          git commit -m "Finalize Companion remediation and Alpha.3 boundaries"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Upload generated candidate lockfile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: companion-remediation-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2
