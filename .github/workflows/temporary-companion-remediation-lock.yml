name: Temporary Alpha.3 workflow finalizer artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-final-workflow:
    name: Render final 38-path Alpha.3 workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Render final workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/v020-alpha3-systems-replayability.yml')
          text = path.read_text(encoding='utf-8')

          yaml_marker = "      - '.github/workflows/v020-alpha3-systems-replayability.yml'\n"
          yaml_addition = (
              yaml_marker
              + "      - 'package-lock.json'\n"
              + "      - 'package.json'\n"
              + "      - 'tools/test_validate_drowned_harbor_controlled_private_shield.py'\n"
              + "      - 'tools/validate_drowned_harbor_controlled_private_shield.py'\n"
          )
          if text.count(yaml_marker) != 2:
              raise SystemExit('unexpected Alpha.3 YAML path-filter marker count')
          text = text.replace(yaml_marker, yaml_addition)

          expected_marker = "              '.github/workflows/v020-alpha3-systems-replayability.yml',\n"
          expected_addition = (
              expected_marker
              + "              'package-lock.json',\n"
              + "              'package.json',\n"
              + "              'tools/test_validate_drowned_harbor_controlled_private_shield.py',\n"
              + "              'tools/validate_drowned_harbor_controlled_private_shield.py',\n"
          )
          if text.count(expected_marker) != 1:
              raise SystemExit('unexpected Alpha.3 exact-boundary marker count')
          text = text.replace(expected_marker, expected_addition)

          old_messages = (
              "          print('Validated exact 34-path Alpha.3 protected-base inventory')\n",
              "            echo 'Exact 34-path Alpha.3 boundary was enforced by the preceding dedicated gate.'\n",
          )
          new_messages = (
              "          print('Validated exact 38-path Alpha.3 protected-base inventory')\n",
              "            echo 'Exact 38-path Alpha.3 boundary was enforced by the preceding dedicated gate.'\n",
          )
          for old, new in zip(old_messages, new_messages):
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected Alpha.3 status marker count: {old!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Upload final workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: final-alpha3-workflow-${{ env.SOURCE_SHA }}
          path: .github/workflows/v020-alpha3-systems-replayability.yml
          if-no-files-found: error
          retention-days: 2
