name: Temporary High Water dependency-boundary finalizer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: Reconcile P0.18 override boundary and mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Apply bounded P0.18 dependency validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old!r}')
              target.write_text(text.replace(old, new, count), encoding='utf-8')

          validator = 'tools/validate_drowned_harbor_high_water_transformation.py'
          replace_exact(
              validator,
              '''    require(
                  "overrides" not in package_json and "resolutions" not in package_json,
                  "dependency override prohibited",
              )
          ''',
              '''    require(
                  lock_packages.get("node_modules/postcss", {}).get("version") == "8.5.23",
                  "lock PostCSS remediation changed",
              )
              require(
                  lock_packages.get("node_modules/undici", {}).get("version") == "7.29.0",
                  "lock Undici remediation changed",
              )
              require(
                  package_json.get("overrides")
                  == {"postcss": "8.5.23", "undici": "7.29.0"},
                  "approved override set drifted",
              )
              require("resolutions" not in package_json, "resolutions prohibited")
          ''',
          )

          mutation_test = 'tools/test_validate_drowned_harbor_high_water_transformation.py'
          marker = '    mutations: list[tuple[str, Mutation]] = [\n'
          baseline = '''    validate_manifest_and_production_boundary(
                  read_json(ROOT / MANIFEST_PATH),
                  read_json(ROOT / CATALOG_PATH),
                  read_json(ROOT / LANTERN_PACKAGE_PATH),
                  (ROOT / PROVIDER_PATH).read_text(encoding="utf-8"),
                  (ROOT / EXPORT_PRESETS_PATH).read_text(encoding="utf-8"),
                  (ROOT / PROJECT_PATH).read_text(encoding="utf-8"),
                  read_json(ROOT / PACKAGE_JSON_PATH),
                  read_json(ROOT / PACKAGE_LOCK_PATH),
              )

              mutations: list[tuple[str, Mutation]] = [
          '''
          # Build the baseline explicitly with main()-level indentation.
          baseline_lines = [
              '    validate_manifest_and_production_boundary(',
              '        read_json(ROOT / MANIFEST_PATH),',
              '        read_json(ROOT / CATALOG_PATH),',
              '        read_json(ROOT / LANTERN_PACKAGE_PATH),',
              '        (ROOT / PROVIDER_PATH).read_text(encoding="utf-8"),',
              '        (ROOT / EXPORT_PRESETS_PATH).read_text(encoding="utf-8"),',
              '        (ROOT / PROJECT_PATH).read_text(encoding="utf-8"),',
              '        read_json(ROOT / PACKAGE_JSON_PATH),',
              '        read_json(ROOT / PACKAGE_LOCK_PATH),',
              '    )',
              '',
              '    mutations: list[tuple[str, Mutation]] = [',
          ]
          replace_exact(mutation_test, marker, '\n'.join(baseline_lines) + '\n')

          dependency_marker = '''        (
                      "dependency pin drift",
          '''
          dependency_cases = '''        (
                      "missing approved overrides",
                      lambda: boundary_mutation(
                          lambda _m, _c, _l, _p, _e, _g, j, _k: j.pop(
                              "overrides", None
                          )
                      ),
                  ),
                  (
                      "approved PostCSS override drift",
                      lambda: boundary_mutation(
                          lambda _m, _c, _l, _p, _e, _g, j, _k: j[
                              "overrides"
                          ].__setitem__("postcss", "8.5.22")
                      ),
                  ),
                  (
                      "extra dependency override",
                      lambda: boundary_mutation(
                          lambda _m, _c, _l, _p, _e, _g, j, _k: j[
                              "overrides"
                          ].__setitem__("sharp", "0.35.2")
                      ),
                  ),
                  (
                      "dependency resolutions introduced",
                      lambda: boundary_mutation(
                          lambda _m, _c, _l, _p, _e, _g, j, _k: j.__setitem__(
                              "resolutions", {"undici": "7.29.0"}
                          )
                      ),
                  ),
                  (
                      "locked PostCSS remediation drift",
                      lambda: boundary_mutation(
                          lambda _m, _c, _l, _p, _e, _g, _j, lock: lock[
                              "packages"
                          ]["node_modules/postcss"].__setitem__("version", "8.5.22")
                      ),
                  ),
                  (
                      "locked Undici remediation drift",
                      lambda: boundary_mutation(
                          lambda _m, _c, _l, _p, _e, _g, _j, lock: lock[
                              "packages"
                          ]["node_modules/undici"].__setitem__("version", "7.28.0")
                      ),
                  ),
                  (
                      "direct Sharp dependency",
                      lambda: boundary_mutation(
                          lambda _m, _c, _l, _p, _e, _g, j, _k: j[
                              "devDependencies"
                          ].__setitem__("sharp", "0.35.2")
                      ),
                  ),
                  (
                      "dependency pin drift",
          '''
          replace_exact(mutation_test, dependency_marker, dependency_cases)

          alpha3_validator = 'tools/validate_drowned_harbor_alpha3_systems.py'
          alpha3_marker = '    "tools/validate_drowned_harbor_controlled_private_shield.py",\n'
          replace_exact(
              alpha3_validator,
              alpha3_marker,
              alpha3_marker
              + '    "tools/test_validate_drowned_harbor_high_water_transformation.py",\n'
              + '    "tools/validate_drowned_harbor_high_water_transformation.py",\n',
          )
          PY
      - name: Compile and run inherited validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/validate_drowned_harbor_high_water_transformation.py
          python -m py_compile tools/test_validate_drowned_harbor_high_water_transformation.py
          python tools/validate_drowned_harbor_controlled_private_shield.py
          python tools/test_validate_drowned_harbor_controlled_private_shield.py
          python tools/validate_drowned_harbor_high_water_transformation.py
          python tools/test_validate_drowned_harbor_high_water_transformation.py
          python tools/validate_drowned_harbor_prototype_automation.py
          python tools/test_validate_drowned_harbor_prototype_automation.py
          python tools/validate_drowned_harbor_alpha3_systems.py --skip-git-boundary
          python tools/test_validate_drowned_harbor_alpha3_systems.py
      - name: Commit bounded Python changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate_drowned_harbor_high_water_transformation.py
          git add tools/test_validate_drowned_harbor_high_water_transformation.py
          git add tools/validate_drowned_harbor_alpha3_systems.py
          git commit -m "Validate bounded High Water dependency overrides"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
