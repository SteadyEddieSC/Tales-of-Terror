name: Temporary format probe

on:
  push:
    branches:
      - 'agent/automated-quality-security-baseline'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked formatter
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-dev.txt

      - name: Print canonical formatting diff
        shell: bash
        run: |
          set -euo pipefail
          gdformat game/tests/quality_baseline_test.gd
          git diff -- game/tests/quality_baseline_test.gd
