name: Mark P0.9 ready once

on:
  pull_request:
    paths:
      - '.github/workflows/mark-p09-ready-once.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark validated P0.9 pull request ready
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr ready 74
