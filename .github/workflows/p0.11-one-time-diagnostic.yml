name: P0.11 one-time validation diagnostic

on:
  push:
    branches: [docs/p0.11-interaction-state-traceability]
    paths:
      - '.github/workflows/p0.11-one-time-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: docs/p0.11-interaction-state-traceability
          show-progress: false
      - name: Capture exact validator output
        run: |
          python tools/validate_interaction_state_traces.py > docs/preproduction/P0.11_validation_diagnostic.txt 2>&1 || true
          cat docs/preproduction/P0.11_validation_diagnostic.txt
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/preproduction/P0.11_validation_diagnostic.txt
          git commit -m "diagnostic: capture P0.11 validator output"
          git push origin HEAD:docs/p0.11-interaction-state-traceability
