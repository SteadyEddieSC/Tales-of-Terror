name: P0.13 one-time GDScript format repair

on:
  push:
    branches: [agent/p0.13-vision-and-prototype-isolation]
    paths:
      - '.github/workflows/p0.13-one-time-gdformat.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/p0.13-vision-and-prototype-isolation
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned GDScript Toolkit
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-dev.txt
      - name: Format the P0.13 Godot proof
        run: gdformat game/tests/drowned_harbor_prototype_isolation_test.gd
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- game/tests/drowned_harbor_prototype_isolation_test.gd; then
            echo 'File is already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/tests/drowned_harbor_prototype_isolation_test.gd
          git commit -m 'style: apply canonical GDScript formatting'
          git push origin HEAD:agent/p0.13-vision-and-prototype-isolation
