name: Preproduction music asset validation

on:
  pull_request:
    paths:
      - '.github/workflows/preproduction-music-assets.yml'
      - 'docs/tales/drowned_harbor/music/**'
      - 'tools/validate_preproduction_music_assets.py'
      - 'tools/test_validate_preproduction_music_assets.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/preproduction-music-assets.yml'
      - 'docs/tales/drowned_harbor/music/**'
      - 'tools/validate_preproduction_music_assets.py'
      - 'tools/test_validate_preproduction_music_assets.py'

permissions:
  contents: read

jobs:
  validate:
    name: Original-first music contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate governed music briefs
        run: python tools/validate_preproduction_music_assets.py
      - name: Run music validator regression tests
        run: python tools/test_validate_preproduction_music_assets.py
