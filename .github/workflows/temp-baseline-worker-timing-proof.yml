name: TEMP baseline Worker timing proof

on:
  pull_request:
    paths:
      - services/room-service/test/worker.integration.test.ts
      - .github/workflows/temp-baseline-worker-timing-proof.yml

permissions:
  contents: read

jobs:
  proof:
    name: Service timing proof only
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Strict TypeScript validation
        run: npm run typecheck
      - name: Full service suite
        run: npm run test:service
      - name: Repeat rate-window recovery 10 times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            echo "rate-window attempt ${attempt}/10"
            npx vitest run --config services/room-service/vitest.config.ts services/room-service/test/worker.integration.test.ts -t "recovers a rate-limited client after the real configured window"
          done
      - name: Repeat heartbeat preservation 10 times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            echo "heartbeat attempt ${attempt}/10"
            npx vitest run --config services/room-service/vitest.config.ts services/room-service/test/worker.integration.test.ts -t "preserves a room with valid host heartbeats"
          done
