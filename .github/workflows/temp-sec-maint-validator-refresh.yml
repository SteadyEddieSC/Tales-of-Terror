name: TEMP SEC-MAINT validator refresh

on:
  push:
    branches:
      - security/sec-maint-002-plus-baseline-tests

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: 3.11.9
      - name: Refresh only current live dependency-pin assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('tools/validate_drowned_harbor_controlled_private_shield.py'),
              Path('tools/validate_drowned_harbor_high_water_transformation.py'),
          ]
          old_overrides = '{"postcss": "8.5.23", "undici": "7.30.1", "sharp": "0.35.5"}'
          new_overrides = '{"postcss": "8.5.23", "source-map-js": "1.2.2", "undici": "7.30.1", "sharp": "0.35.5"}'

          for path in files:
              text = path.read_text(encoding='utf-8')
              if text.count('"0.35.4"') != 2:
                  raise SystemExit(f'{path}: expected exactly 2 Sharp 0.35.4 live-pin references')
              if text.count('"7.29.0"') != 2:
                  raise SystemExit(f'{path}: expected exactly 2 Undici 7.29.0 live-pin references')
              text = text.replace('"0.35.4"', '"0.35.5"')
              text = text.replace('"7.29.0"', '"7.30.1"')
              if text.count(old_overrides) != 1:
                  raise SystemExit(f'{path}: expected one exact live override policy assertion')
              text = text.replace(old_overrides, new_overrides)
              if text.count('"source-map-js": "1.2.2"') != 1:
                  raise SystemExit(f'{path}: source-map-js live override assertion not unique')
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check -- tools/validate_drowned_harbor_controlled_private_shield.py tools/validate_drowned_harbor_high_water_transformation.py
      - name: Prove refreshed validators and fail-closed mutation suites
        run: |
          python tools/validate_drowned_harbor_controlled_private_shield.py
          python tools/test_validate_drowned_harbor_controlled_private_shield.py
          python tools/validate_drowned_harbor_high_water_transformation.py
          python tools/test_validate_drowned_harbor_high_water_transformation.py
      - name: Commit only the two refreshed validators
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eddie-LowcountryDigitalWorks'
          git config user.email 'eddie@lowcountrydigitalworks.com'
          git add tools/validate_drowned_harbor_controlled_private_shield.py tools/validate_drowned_harbor_high_water_transformation.py
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'test: refresh Drowned Harbor live dependency pins'
          git push origin HEAD:security/sec-maint-002-plus-baseline-tests
