name: SEC-MAINT-002 one-shot lock refresh

on:
  push:
    branches:
      - test/baseline-173-174-repair
    paths:
      - package.json
      - .github/workflows/sec-maint-002-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Resolve exact candidate lock without install scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm audit --json > npm-audit.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify(counts));
          if ((counts.total ?? 0) !== 0) throw new Error('Resolved lock is not audit-clean');
          NODE
      - name: Commit generated lock only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches candidate'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'SECURITY-MAINT: refresh audit-clean lockfile'
          git push origin HEAD:test/baseline-173-174-repair
