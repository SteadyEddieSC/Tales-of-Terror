name: P0.12 one-time production-boundary data repair

on:
  push:
    branches: [docs/p0.12-prototype-authorization]
    paths:
      - '.github/workflows/p0.12-one-time-production-boundary-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: docs/p0.12-prototype-authorization
      - name: Add explicit production prohibition to remaining work packages
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/tales/drowned_harbor/implementation/drowned_harbor_prototype_authorization_v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          target_ids = {'DH-PROT-004', 'DH-PROT-006', 'DH-PROT-007'}
          added = 'Production Tale integration or registration'
          observed = set()
          for package in data['work_packages']:
              if package['package_id'] in target_ids:
                  if added in package['prohibited_outputs']:
                      raise SystemExit(f"{package['package_id']} already contains asserted prohibition")
                  package['prohibited_outputs'].append(added)
                  observed.add(package['package_id'])
          if observed != target_ids:
              raise SystemExit(f'missing expected packages: {sorted(target_ids - observed)}')
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tales/drowned_harbor/implementation/drowned_harbor_prototype_authorization_v1.json
          git commit -m 'docs: reinforce production boundary in all prototype work packages'
          git push origin HEAD:docs/p0.12-prototype-authorization
