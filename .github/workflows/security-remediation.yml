name: One-time workflow security remediation

on:
  push:
    branches:
      - 'agent/automated-quality-security-baseline'
    paths:
      - '.github/workflows/security-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    if: github.repository == 'SteadyEddieSC/Tales-of-Terror'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/automated-quality-security-baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Apply reviewed workflow hardening transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          for path in sorted(root.glob('*.y*ml')):
              if path.name == 'security-remediation.yml':
                  continue
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              index = 0
              while index < len(lines):
                  line = lines[index]
                  if 'uses: actions/checkout@' not in line:
                      index += 1
                      continue
                  indent = len(line) - len(line.lstrip(' '))
                  end = index + 1
                  while end < len(lines):
                      stripped = lines[end].lstrip(' ')
                      current_indent = len(lines[end]) - len(stripped)
                      if current_indent < indent:
                          break
                      if current_indent == indent - 2 and stripped.startswith('- '):
                          break
                      end += 1
                  block = ''.join(lines[index:end])
                  if 'persist-credentials:' in block:
                      index = end
                      continue
                  with_index = None
                  for candidate in range(index + 1, end):
                      if (
                          lines[candidate].strip() == 'with:'
                          and len(lines[candidate]) - len(lines[candidate].lstrip(' ')) == indent
                      ):
                          with_index = candidate
                          break
                  newline = '\r\n' if line.endswith('\r\n') else '\n'
                  if with_index is not None:
                      lines.insert(
                          with_index + 1,
                          ' ' * (indent + 2) + 'persist-credentials: false' + newline,
                      )
                      index = end + 1
                  else:
                      lines[index + 1:index + 1] = [
                          ' ' * indent + 'with:' + newline,
                          ' ' * (indent + 2) + 'persist-credentials: false' + newline,
                      ]
                      index = end + 2
              text = ''.join(lines)
              if path.name in {'quality-baseline.yml', 'security-baseline.yml'}:
                  text = ''.join(
                      line
                      for line in text.splitlines(keepends=True)
                      if line.strip()
                      not in {
                          'cache: pip',
                          'cache: npm',
                          'cache-dependency-path: requirements-dev.txt',
                      }
                  )
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/security-remediation.yml').unlink()
          PY

          python - <<'PY'
          from pathlib import Path

          failures = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              lines = path.read_text(encoding='utf-8').splitlines()
              for index, line in enumerate(lines):
                  if 'uses: actions/checkout@' not in line:
                      continue
                  indent = len(line) - len(line.lstrip(' '))
                  end = index + 1
                  while end < len(lines):
                      stripped = lines[end].lstrip(' ')
                      current_indent = len(lines[end]) - len(stripped)
                      if current_indent < indent:
                          break
                      if current_indent == indent - 2 and stripped.startswith('- '):
                          break
                      end += 1
                  if not any('persist-credentials: false' in item for item in lines[index:end]):
                      failures.append(f'{path}:{index + 1}')
          for name in ('quality-baseline.yml', 'security-baseline.yml'):
              text = Path('.github/workflows', name).read_text(encoding='utf-8')
              if any(
                  line.strip() in {
                      'cache: pip',
                      'cache: npm',
                      'cache-dependency-path: requirements-dev.txt',
                  }
                  for line in text.splitlines()
              ):
                  failures.append(f'{name}: dependency cache remains')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
          git diff --check

      - name: Commit and push the isolated remediation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Terror Turn Development Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'Harden inherited GitHub Actions workflows'
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" \
            push origin "HEAD:agent/automated-quality-security-baseline"
