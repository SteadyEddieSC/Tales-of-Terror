name: P0.21 production architecture validation

on:
  pull_request:
    paths:
      - '.github/workflows/p021-production-architecture.yml'
      - '.github/workflows/post-prototype-reconciliation.yml'
      - 'README.md'
      - 'docs/preproduction/README.md'
      - 'docs/preproduction/P0.21_Release_Summary.md'
      - 'docs/preproduction/post_prototype_status_v1.json'
      - 'docs/preproduction/drowned_harbor_production_compilation_contract_schema_v1.json'
      - 'docs/preproduction/drowned_harbor_production_compilation_contract_v1.json'
      - 'docs/preproduction/P0.21_Implementation_Issue_Set.md'
      - 'docs/technical/Drowned_Harbor_Production_Architecture_and_Compilation_Contract_v1.md'
      - 'docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md'
      - 'tools/validate_p021_production_architecture.py'
      - 'tools/test_validate_p021_production_architecture.py'
      - 'tools/validate_post_prototype_reconciliation.py'
      - 'tools/test_validate_post_prototype_reconciliation.py'
  push:
    branches:
      - main
      - docs/p0.21-production-architecture-contract
    paths:
      - '.github/workflows/p021-production-architecture.yml'
      - '.github/workflows/post-prototype-reconciliation.yml'
      - 'README.md'
      - 'docs/preproduction/README.md'
      - 'docs/preproduction/P0.21_Release_Summary.md'
      - 'docs/preproduction/post_prototype_status_v1.json'
      - 'docs/preproduction/drowned_harbor_production_compilation_contract_schema_v1.json'
      - 'docs/preproduction/drowned_harbor_production_compilation_contract_v1.json'
      - 'docs/preproduction/P0.21_Implementation_Issue_Set.md'
      - 'docs/technical/Drowned_Harbor_Production_Architecture_and_Compilation_Contract_v1.md'
      - 'docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md'
      - 'tools/validate_p021_production_architecture.py'
      - 'tools/test_validate_p021_production_architecture.py'
      - 'tools/validate_post_prototype_reconciliation.py'
      - 'tools/test_validate_post_prototype_reconciliation.py'

permissions:
  contents: read

jobs:
  architecture:
    name: Validate compilation contract and blocked implementation stages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9

      - name: Validate P0.21 production architecture
        run: python tools/validate_p021_production_architecture.py

      - name: Run P0.21 fail-closed mutations
        run: python tools/test_validate_p021_production_architecture.py

      - name: Validate status succession
        run: |
          python tools/validate_post_prototype_reconciliation.py
          python tools/test_validate_post_prototype_reconciliation.py

      - name: Preserve design-only authoring contracts
        run: |
          python tools/validate_tale_authoring_reference.py
          python tools/test_validate_tale_authoring_reference.py

      - name: Preserve production package and catalog contracts
        run: |
          python tools/tale_package.py validate
          python tools/test_tale_package.py
          python tools/tale_catalog.py validate
          python tools/test_tale_catalog.py

      - name: Prove clean source tree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
