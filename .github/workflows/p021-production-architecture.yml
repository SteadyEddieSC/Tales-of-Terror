name: Frozen P0.21 production architecture preservation

on:
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/p021-production-architecture.yml'
      - '.github/workflows/p022-alpha2-graybox-contract.yml'
      - '.github/workflows/p023-alpha3-systems-replayability-contract.yml'
      - '.github/workflows/post-prototype-reconciliation.yml'
      - 'docs/preproduction/P0.21_Implementation_Issue_Set.md'
      - 'docs/preproduction/P0.23_Alpha3_Implementation_Issue.md'
      - 'docs/preproduction/README.md'
      - 'docs/preproduction/drowned_harbor_alpha3_systems_replayability_contract_schema_v1.json'
      - 'docs/preproduction/drowned_harbor_alpha3_systems_replayability_contract_v1.json'
      - 'docs/preproduction/post_prototype_status_v1.json'
      - 'docs/releases/P0.23-alpha3-systems-replayability-contract.md'
      - 'docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md'
      - 'docs/technical/Drowned_Harbor_Alpha3_Systems_and_Replayability_Contract_v1.md'
      - 'tools/test_validate_p023_alpha3_systems_replayability_contract.py'
      - 'tools/validate_p023_alpha3_systems_replayability_contract.py'
      - 'tools/test_validate_post_dh_present_status.py'
      - 'tools/validate_post_dh_present_status.py'
      - 'tools/test_validate_post_dh_ux_status.py'
      - 'tools/validate_post_dh_ux_status.py'
      - 'tools/test_validate_post_dh_rights_status.py'
      - 'tools/validate_post_dh_rights_status.py'
      - 'tools/test_validate_post_dh_owner_attest_status.py'
      - 'tools/validate_post_dh_owner_attest_status.py'
  push:
    branches: [main, docs/p0.22-alpha2-graybox-contract, docs/p0.23-alpha3-systems-replayability-contract]
    paths:
      - 'README.md'
      - '.github/workflows/p021-production-architecture.yml'
      - '.github/workflows/p022-alpha2-graybox-contract.yml'
      - '.github/workflows/p023-alpha3-systems-replayability-contract.yml'
      - '.github/workflows/post-prototype-reconciliation.yml'
      - 'docs/preproduction/P0.21_Implementation_Issue_Set.md'
      - 'docs/preproduction/P0.23_Alpha3_Implementation_Issue.md'
      - 'docs/preproduction/README.md'
      - 'docs/preproduction/drowned_harbor_alpha3_systems_replayability_contract_schema_v1.json'
      - 'docs/preproduction/drowned_harbor_alpha3_systems_replayability_contract_v1.json'
      - 'docs/preproduction/post_prototype_status_v1.json'
      - 'docs/releases/P0.23-alpha3-systems-replayability-contract.md'
      - 'docs/roadmap/Post_P0.19_Production_Candidate_Roadmap.md'
      - 'docs/technical/Drowned_Harbor_Alpha3_Systems_and_Replayability_Contract_v1.md'
      - 'tools/test_validate_p023_alpha3_systems_replayability_contract.py'
      - 'tools/validate_p023_alpha3_systems_replayability_contract.py'
      - 'tools/test_validate_post_dh_present_status.py'
      - 'tools/validate_post_dh_present_status.py'
      - 'tools/test_validate_post_dh_ux_status.py'
      - 'tools/validate_post_dh_ux_status.py'
      - 'tools/test_validate_post_dh_rights_status.py'
      - 'tools/validate_post_dh_rights_status.py'
      - 'tools/test_validate_post_dh_owner_attest_status.py'
      - 'tools/validate_post_dh_owner_attest_status.py'

permissions:
  contents: read

jobs:
  compatibility:
    name: Preserve P0.21 authority and validate current succession
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.9
      - name: Select strict historical or current succession validation
        shell: bash
        run: |
          set -euo pipefail
          effective="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [[ "$effective" == "docs/p0.22-alpha2-graybox-contract" ]]; then
            python tools/validate_p022_alpha2_graybox_contract.py
            python tools/test_validate_p022_alpha2_graybox_contract.py
            python tools/validate_post_prototype_reconciliation.py
            python tools/test_validate_post_prototype_reconciliation.py
            python tools/validate_p021_production_architecture.py
            python tools/test_validate_p021_production_architecture.py
          elif [[ "$effective" == "docs/p0.23-alpha3-systems-replayability-contract" ]]; then
            python tools/validate_p023_alpha3_systems_replayability_contract.py
            python tools/test_validate_p023_alpha3_systems_replayability_contract.py
          elif [[ "$effective" == "docs/post-alpha3-status-reconciliation" ]]; then
            python tools/validate_p023_alpha3_systems_replayability_contract.py --skip-git-boundary --later-succession
            python tools/test_validate_p023_alpha3_systems_replayability_contract.py --later-succession
          elif [[ "$effective" == "docs/post-dh-present-status-reconciliation" ]]; then
            python tools/validate_post_dh_present_status.py
            python tools/test_validate_post_dh_present_status.py
          elif [[ "$effective" == "docs/post-dh-ux-status-reconciliation" ]]; then
            python tools/validate_post_dh_ux_status.py
            python tools/test_validate_post_dh_ux_status.py
          elif [[ "$effective" == "docs/post-dh-rights-status-reconciliation" ]]; then
            python tools/validate_post_dh_rights_status.py
            python tools/test_validate_post_dh_rights_status.py
          else
            python tools/validate_post_dh_owner_attest_status.py
            python tools/test_validate_post_dh_owner_attest_status.py
          fi
      - name: Prove clean source tree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
