name: P0.12 one-time contract path repair

on:
  push:
    branches: [docs/p0.12-prototype-authorization]
    paths:
      - '.github/workflows/p0.12-one-time-contract-path-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: docs/p0.12-prototype-authorization
      - name: Replace stale P0.11 contract path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/tales/drowned_harbor/implementation/drowned_harbor_prototype_authorization_v1.json')
          old = 'docs/technical/Interaction_State_and_Implementation_Traceability_Contract_v1.md'
          new = 'docs/technical/Drowned_Harbor_Interaction_State_Traceability_Contract_v1.md'
          text = path.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'expected 4 stale contract references, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tales/drowned_harbor/implementation/drowned_harbor_prototype_authorization_v1.json
          git commit -m 'docs: correct P0.11 interaction contract references'
          git push origin HEAD:docs/p0.12-prototype-authorization
